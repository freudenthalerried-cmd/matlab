name: Fire TV APK
on:
  push:
    paths: ['firetv-app/**', '.github/workflows/firetv-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle -p firetv-app assembleRelease --no-daemon
      - run: |
          cp firetv-app/app/build/outputs/apk/release/app-release.apk AbendKino.apk
          echo '{"versionCode": ${{ github.run_number }}}' > version.json
      - uses: actions/upload-artifact@v4
        with: { name: AbendKino, path: AbendKino.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: firetv
          name: AbendKino (Fire TV)
          make_latest: false
          files: |
            AbendKino.apk
            version.json
          body: |
            Downloader-Code: 5263007 (aftv.news/5263007)
            Direkt-Link: https://github.com/${{ github.repository }}/releases/download/firetv/AbendKino.apk
