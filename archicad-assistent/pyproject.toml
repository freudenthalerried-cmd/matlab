[project]
name = "archicad-assistent"
version = "0.1.0"
description = "Archicad per Text (später Sprache) steuern – über die offizielle JSON-API und das Tapir-Add-On."
requires-python = ">=3.10"
dependencies = ["anthropic>=1.15"]

[project.scripts]
archicad-assistent = "archicad_assistent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["archicad_assistent"]
