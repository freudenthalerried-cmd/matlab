plugins { id 'com.android.application' }

def store = new Properties()
file('../store.properties').withInputStream { store.load(it) }

android {
    namespace 'io.github.freudenthalerried.burgwacht'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.freudenthalerried.burgwacht'
        minSdk 24
        targetSdk 36
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName store.VERSION_NAME
        manifestPlaceholders = [admobAppId: store.ADMOB_APP_ID]
        buildConfigField 'String', 'AD_REWARDED', "\"${store.AD_REWARDED}\""
        buildConfigField 'String', 'AD_INTERSTITIAL', "\"${store.AD_INTERSTITIAL}\""
        buildConfigField 'String', 'PRODUCT_ID', "\"${store.PRODUCT_ID}\""
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.gms:play-services-ads:24.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'
    implementation 'com.android.billingclient:billing:8.0.0'
}
