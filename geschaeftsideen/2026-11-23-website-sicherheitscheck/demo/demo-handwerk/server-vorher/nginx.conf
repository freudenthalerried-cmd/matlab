# VORHER-Zustand der fiktiven demo-handwerk.at (typischer Billig-Hosting-Stand)
worker_processes 1;
user root;
pid run/nginx.pid;
error_log run/error.log;
events { worker_connections 64; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path run/tmp;
  # server_tokens on (Standard) -> "Server: nginx/1.24.0"

  server {
    listen 127.0.0.1:80;
    server_name demo-handwerk.at www.demo-handwerk.at;
    root www;
    # keine Weiterleitung auf HTTPS
    add_header X-Powered-By "PHP/7.4.33";
    add_header Set-Cookie "PHPSESSID=demo123; path=/";
    location / { try_files $uri $uri/ =404; }
  }

  server {
    listen 127.0.0.1:443 ssl;
    server_name demo-handwerk.at www.demo-handwerk.at;
    ssl_certificate ../tls/demo-handwerk.crt;
    ssl_certificate_key ../tls/demo-handwerk.key;
    root www;
    add_header X-Powered-By "PHP/7.4.33";
    add_header Set-Cookie "PHPSESSID=demo123; path=/";
    location / { try_files $uri $uri/ =404; }
  }
}
