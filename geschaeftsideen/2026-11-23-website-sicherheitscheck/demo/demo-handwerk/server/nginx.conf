# NACHHER-Zustand der fiktiven demo-handwerk.at – Fix 2026-001 (Seitencheck)
worker_processes 1;
user root;
pid run/nginx.pid;
error_log run/error.log;
events { worker_connections 64; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path run/tmp;
  server_tokens off;                         # Fix: keine nginx-Version

  # Fix: HTTP -> HTTPS (301)
  server {
    listen 127.0.0.1:80;
    server_name demo-handwerk.at www.demo-handwerk.at;
    return 301 https://$host$request_uri;
  }

  server {
    listen 127.0.0.1:443 ssl;
    server_name demo-handwerk.at www.demo-handwerk.at;
    ssl_certificate ../tls/demo-handwerk.crt;
    ssl_certificate_key ../tls/demo-handwerk.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root www;

    # Fix: Sicherheits-Header
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com; frame-src https://www.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Fix: X-Powered-By entfernt (beim echten Kunden: expose_php = Off bzw. fastcgi_hide_header).
    # ACHTUNG: PHP selbst ist damit NICHT aktualisiert – PHP 8.3 im Hoster-Panel umstellen!
    # Fix: Session-Cookie gehaertet (echt: session.cookie_secure/httponly/samesite in php.ini)
    add_header Set-Cookie "PHPSESSID=demo123; path=/; Secure; HttpOnly; SameSite=Lax" always;
    location / { try_files $uri $uri/ =404; }
  }
}
