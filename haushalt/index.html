<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wo ist was?</title>
<meta name="theme-color" content="#2f6f4f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#f6f7f5;--card:#fff;--text:#1d2320;--muted:#66706a;--accent:#2f6f4f;--accent-2:#e7f1ec;--border:#dde2de;--danger:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#141816;--card:#1e2320;--text:#e8ece9;--muted:#9aa49e;--accent:#6fbf94;--accent-2:#23332a;--border:#303833;--danger:#f2877f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--border)}
h1{font-size:1.25rem;margin:0 0 8px}
h2{font-size:1.05rem;margin:18px 0 8px}
main{padding:12px 16px;max-width:720px;margin:0 auto}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card)}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:var(--accent-2);color:var(--text)}
button.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
button:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.muted{color:var(--muted);font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--accent-2);border-radius:999px;padding:4px 10px;font-size:.9rem;display:inline-flex;gap:6px;align-items:center}
.chip b{cursor:pointer;opacity:.6}
.hit{display:flex;gap:12px;align-items:center}
.hit img,.thumb{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none;background:var(--accent-2)}
.path{font-weight:600;color:var(--accent)}
mark{background:#ffe38a;color:#000;border-radius:3px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;color:var(--muted);border-radius:0;padding:10px 4px;font-size:.8rem;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.active{color:var(--accent)}
nav span{font-size:1.3rem}
.hidden{display:none!important}
.preview{width:100%;max-height:320px;object-fit:contain;border-radius:12px;background:#000}
.big{width:100%;padding:16px;font-size:1.05rem}
details summary{cursor:pointer;font-weight:600}
.status{padding:10px;border-radius:10px;background:var(--accent-2);margin:8px 0}
label{display:block;margin:10px 0 4px;font-size:.9rem;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>🏠 Wo ist was?</h1>
  <input id="q" type="search" placeholder="Was suchst du? z. B. Schere, Batterien …" autocomplete="off">
</header>

<main>
  <!-- Suche -->
  <section id="v-search">
    <div id="results"></div>
  </section>

  <!-- Foto aufnehmen -->
  <section id="v-add" class="hidden">
    <h2>Foto aufnehmen</h2>
    <div class="card">
      <label for="room">Raum</label>
      <input id="room" list="rooms" placeholder="z. B. Küche">
      <datalist id="rooms"></datalist>
      <label for="place">Ort / Behälter</label>
      <input id="place" list="places" placeholder="z. B. Lade links oben">
      <datalist id="places"></datalist>
      <div class="row" style="margin-top:12px">
        <button class="ghost" id="btn-cam">📷 Kamera</button>
        <button class="ghost" id="btn-file">🖼️ Galerie</button>
      </div>
      <input id="f-cam" type="file" accept="image/*" capture="environment" class="hidden">
      <input id="f-file" type="file" accept="image/*" class="hidden">
      <div id="add-preview" style="margin-top:12px">
        <img id="prev-img" class="preview hidden" alt="Vorschau">
        <div id="add-status" class="status hidden"></div>
        <label>Erkannte Gegenstände (antippen ✕ zum Entfernen)</label>
        <div id="add-items" class="chips"></div>
        <div class="row" style="margin-top:8px">
          <input id="add-manual" placeholder="Gegenstand ergänzen …">
          <button class="ghost" id="btn-add-manual" style="flex:none">+</button>
        </div>
        <button class="big" id="btn-save" style="margin-top:12px">💾 Speichern</button>
      </div>
    </div>
  </section>

  <!-- Räume -->
  <section id="v-rooms" class="hidden">
    <div id="room-list"></div>
  </section>

  <!-- Einstellungen -->
  <section id="v-settings" class="hidden">
    <h2>Einstellungen</h2>
    <div class="card">
      <label for="apikey">Anthropic API-Schlüssel (für die Bilderkennung)</label>
      <input id="apikey" type="password" placeholder="sk-ant-…" autocomplete="off">
      <label for="model">Modell</label>
      <select id="model">
        <option value="claude-haiku-4-5-20251001">Haiku 4.5 – günstig &amp; schnell</option>
        <option value="claude-sonnet-5">Sonnet 5 – genauer</option>
      </select>
      <button id="btn-save-settings" style="margin-top:12px">Speichern</button>
      <p class="muted">Der Schlüssel bleibt nur auf diesem Gerät gespeichert und wird ausschließlich an api.anthropic.com gesendet. Ohne Schlüssel kannst du Gegenstände manuell eintragen.</p>
    </div>
    <div class="card">
      <div class="row">
        <button class="ghost" id="btn-export">⬇️ Sichern (JSON)</button>
        <button class="ghost" id="btn-import">⬆️ Wiederherstellen</button>
      </div>
      <input id="f-import" type="file" accept="application/json" class="hidden">
      <p class="muted">Alle Daten (inkl. Fotos) liegen lokal im Browser. Regelmäßig sichern!</p>
    </div>
  </section>
</main>

<nav>
  <button data-v="search" class="active"><span>🔍</span>Suchen</button>
  <button data-v="add"><span>📷</span>Foto</button>
  <button data-v="rooms"><span>🏠</span>Räume</button>
  <button data-v="settings"><span>⚙️</span>Einstell.</button>
</nav>

<script src="app.js"></script>
</body>
</html>
