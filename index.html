<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baustelle Protokoll</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="chat">
    <header class="app-header">
      <div class="app-title">Sicherheit am Bau – Protokoll</div>
      <div class="header-row">
        <input id="ort-input" class="ort-input" type="text" placeholder="Ort / Baustelle" aria-label="Ort">
        <button id="allgemein-button" class="tool-button tool-button-text" type="button" title="Allgemeine Punkte einfügen">Allg.</button>
        <button id="print-button" class="tool-button" type="button" title="Bericht drucken">&#128424;</button>
        <button id="bausteine-button" class="tool-button" type="button" title="Textbausteine">&#9776;</button>
      </div>
    </header>

    <ul id="messages" class="messages" aria-live="polite"></ul>

    <div id="foto-kategorien" class="foto-kategorien" hidden>
      <div class="panel-hint">Was ist am Foto zu sehen?</div>
      <div id="foto-kategorien-chips" class="chips"></div>
    </div>

    <div id="allgemein-panel" class="allgemein-panel" hidden>
      <div class="panel-hint">Allgemeine Punkte für den Bericht auswählen:</div>
      <div id="allgemein-liste" class="allgemein-liste"></div>
      <div class="allgemein-aktionen">
        <button id="allgemein-einfuegen" class="chip" type="button">Ausgewählte einfügen</button>
        <button id="allgemein-abbrechen" class="chip chip-kategorie" type="button">Abbrechen</button>
      </div>
    </div>

    <div id="ki-vorschlaege" class="ki-vorschlaege" hidden>
      <div class="panel-hint ki-kopf">
        <span>KI-Vorschlag (nur Sicherheit) – tippen zum Einfügen:</span>
        <span class="detail-regler">
          <button id="detail-minus" class="detail-button" type="button" title="Kürzere Antwort">&minus;</button>
          <span id="detail-label">Normal</span>
          <button id="detail-plus" class="detail-button" type="button" title="Längere Antwort mit Gesetzestext">+</button>
        </span>
      </div>
      <div id="ki-chips" class="chips"></div>
    </div>

    <div class="typ-schalter" role="group" aria-label="Eintragstyp">
      <button id="typ-hinweis" class="typ-knopf typ-aktiv" type="button">Hinweis</button>
      <button id="typ-mangel" class="typ-knopf" type="button">Mangel</button>
    </div>

    <div id="bearbeiten-hinweis" class="bearbeiten-hinweis" hidden>
      Eintrag wird bearbeitet – Senden speichert die Änderung.
      <button id="bearbeiten-abbrechen" type="button">Abbrechen</button>
    </div>

    <div id="foto-preview" class="foto-preview" hidden>
      <img id="foto-preview-img" alt="Foto-Vorschau">
      <button id="foto-remove" class="foto-remove" type="button" aria-label="Foto entfernen">&times;</button>
    </div>

    <form id="chat-form" class="chat-form" autocomplete="off">
      <label class="foto-button" for="foto-input" title="Foto hinzufügen">&#128247;</label>
      <input id="foto-input" type="file" accept="image/*" capture="environment" hidden>
      <textarea
        id="chat-input"
        class="chat-input"
        rows="1"
        placeholder="Eintrag eingeben… (Kürzel: helm, gas, wehren, wege …)"
        aria-label="Eintrag"
      ></textarea>
      <button
        id="send-button"
        class="send-button"
        type="submit"
        aria-label="Eintrag speichern"
        disabled
      >&#10148;</button>
    </form>

    <div id="bausteine-panel" class="bausteine-panel" hidden>
      <div class="panel-header">
        <span>Textbausteine (nach Häufigkeit)</span>
        <button id="bausteine-close" class="tool-button" type="button" aria-label="Schließen">&times;</button>
      </div>
      <ul id="bausteine-liste" class="bausteine-liste"></ul>
    </div>
  </main>

  <script src="textbausteine.js"></script>
  <script src="script.js"></script>
</body>
</html>
