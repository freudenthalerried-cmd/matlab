<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat – Freudenthaler Bau</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="protokoll.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">Freudenthaler <span>Bau</span></a>
    <nav class="site-nav">
      <a href="index.html" class="active">Chat</a>
      <a href="protokoll.html">Protokoll</a>
    </nav>
  </header>

  <main class="chat">
    <ul id="messages" class="messages" aria-live="polite"></ul>

    <form id="chat-form" class="chat-form" autocomplete="off">
      <input
        id="chat-input"
        class="chat-input"
        type="text"
        placeholder="Nachricht eingeben…"
        aria-label="Nachricht"
      >
      <button
        id="send-button"
        class="send-button"
        type="submit"
        aria-label="Senden"
        disabled
      >&#10148;</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
