<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Raumplan 3D</title>
<meta name="description" content="Wohnung in 3D begehen, Möbel verschieben, Wände streichen, Licht einstellen.">
<meta name="theme-color" content="#14181d">
<link rel="icon" href="icon.svg">
<style>
:root{--bg:#14181d;--card:#20262e;--card2:#2c343e;--line:#37404b;--fg:#f2f4f6;--mut:#a3adb8;--ok:#3ecf74;--warn:#ffb020;--bad:#ff5a5a;--acc:#4da3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer}
button.main{background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:700}
button.no{color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.4}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select{font:inherit;color:inherit;background:#0e1216;border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
input[type=color]{padding:2px;height:44px;width:64px;flex:0 0 64px}
input[type=range]{padding:0;border:0;background:none;width:100%;accent-color:var(--acc);height:32px}
#top{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(#14181de0,#14181d00);pointer-events:none;z-index:10}
#top>*{pointer-events:auto}
#top .ttl{font-weight:700;margin-right:auto;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#top .ttl small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
#bUndo{min-height:40px;padding:4px 12px;font-size:20px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;flex:0 0 auto}
.seg button{border:0;background:none;min-height:36px;padding:6px 9px;border-radius:9px;font-size:14px}
.seg button.on{background:var(--acc);color:#04121f;font-weight:700}
#tools{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:#14181df2;border-top:1px solid var(--line);z-index:10}
#tools button{flex:1 1 0;max-width:110px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:20px;border:0;background:none;padding:5px 2px;min-height:54px}
#tools button span{font-size:12px;color:var(--mut)}
#tools button.on{background:var(--card2)}
#tools button.on span{color:var(--fg)}
.panel{position:fixed;left:8px;right:8px;bottom:calc(74px + env(safe-area-inset-bottom));max-height:46vh;overflow:auto;overscroll-behavior:contain;background:#1a1f26f5;border:1px solid var(--line);border-radius:16px;padding:12px;z-index:9;box-shadow:0 8px 30px #0008}
#sel{max-height:42vh}
@media (min-width:900px){.panel{left:auto;right:12px;width:400px;bottom:86px;max-height:calc(100vh - 170px)}}
.sh-head{display:flex;align-items:center;gap:8px;margin:-2px 0 8px}
.sh-head b{flex:1;font-size:18px}
.sh-head button{min-height:36px;padding:4px 12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.tabs button{white-space:nowrap;min-height:36px;padding:6px 12px;font-size:14px}
.tabs button.on{background:var(--acc);color:#04121f;border-color:var(--acc);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.grid button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;font-size:14px;text-align:center;line-height:1.2}
.grid .ic{font-size:28px}
.mut{color:var(--mut);font-size:14px}
.note{color:var(--mut);font-size:12px;margin:10px 0 0}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.sw button{width:42px;height:42px;min-height:0;padding:0;border-radius:50%;border:2px solid #0006}
.sw button.on{outline:3px solid #fff;outline-offset:2px}
.fl{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.fl button{padding:0;overflow:hidden;display:flex;flex-direction:column;font-size:13px;min-height:0;line-height:1.2}
.fl button i{display:block;height:54px;background-size:cover;background-position:center}
.fl button span{padding:6px 4px}
.fl button.on{outline:3px solid var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
.row>*{flex:1 1 auto}
.row>a{flex:0 0 auto}
label{display:block;font-size:14px;color:var(--mut)}
label.chk{display:flex;gap:8px;align-items:center;color:var(--fg);font-size:15px;margin:6px 0}
label.chk input{width:22px;height:22px;flex:0 0 22px}
.ctl{margin:8px 0}
.ctl b{float:right;color:var(--fg);font-weight:600}
a.aff{display:inline-flex;align-items:center;gap:4px;background:#ff9900;color:#111;font-weight:700;text-decoration:none;border-radius:10px;padding:8px 12px;font-size:14px;white-space:nowrap}
ul.li{list-style:none;padding:0;margin:6px 0}
ul.li li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;border:1px solid #0006}
.list{display:flex;flex-direction:column;gap:8px}
.list button{text-align:left}
h3{font-size:16px;margin:14px 0 6px}
.help li{margin:6px 0}
#hint{position:fixed;left:50%;top:calc(62px + env(safe-area-inset-top));transform:translateX(-50%);background:#000d;color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;z-index:20;pointer-events:none;max-width:calc(100% - 32px);text-align:center;transition:opacity .3s;opacity:0}
#hint.on{opacity:1}
#joy{position:fixed;left:22px;bottom:calc(96px + env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;background:#ffffff1c;border:2px solid #ffffff45;touch-action:none;z-index:8}
#knob{position:absolute;left:36px;top:36px;width:52px;height:52px;border-radius:50%;background:#ffffffb0;pointer-events:none}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:50;background:var(--bg)}
</style>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="3D-Ansicht der Wohnung"></canvas>
<header id="top">
  <button id="bUndo" title="Rückgängig (Strg+Z)" aria-label="Rückgängig" disabled>↶</button>
  <div class="ttl" id="ttl">Raumplan 3D<small id="sub"></small></div>
  <div class="seg" id="views" role="group" aria-label="Ansicht">
    <button data-v="gehen">🚶 Gehen</button><button data-v="haus" class="on">🏠 Haus</button><button data-v="plan">⬛ Plan</button>
  </div>
</header>
<div id="hint" role="status" aria-live="polite"></div>
<div id="joy" hidden aria-hidden="true"><div id="knob"></div></div>
<section id="sheet" class="panel" hidden aria-live="polite">
  <div class="sh-head"><b id="shTitle"></b><button id="shX" aria-label="Schließen">✕</button></div>
  <div id="shBody"></div>
</section>
<section id="sel" class="panel" hidden></section>
<nav id="tools">
  <button data-t="moebel">➕<span>Möbel</span></button>
  <button data-t="farbe">🎨<span>Wände</span></button>
  <button data-t="boden">🪵<span>Boden</span></button>
  <button data-t="licht">💡<span>Licht</span></button>
  <button data-t="liste">🛒<span>Einkauf</span></button>
  <button data-t="menu">☰<span>Menü</span></button>
</nav>
<input type="file" id="file" accept=".json,application/json,text/plain" hidden>
<div id="err" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
