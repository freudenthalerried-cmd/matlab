<h1>Lieferung</h1>
<p class="lede">Die Frachtsätze stammen aus den tatsächlichen Lieferantenrechnungen, nicht aus einer
Annahme. Sie werden getrennt ausgewiesen, weil sie je Lieferung anfallen und nicht je Artikel.</p>

<div class="preistafel">
  <div><span class="k">Pauschale je Lieferung</span><span class="w">75,50 €</span><span class="e">netto, Fracht plus Energiekostenzuschlag</span></div>

<h2>Warum es kein „frei Haus" gibt</h2>
<p>Weil die Frachtpauschale bei unserem Lieferanten auf jedem Beleg steht — auch auf den großen. Wer sie
trotzdem als „frei Haus" bewirbt, hat sie in die Warenpreise eingerechnet, und zwar in alle. Auch in die
des Kunden, der selbst abholt.</p>
<p>Die ausführliche Begründung samt Rechnung steht unter
<a href="#wissen/warum-keine-gratislieferung">Warum es keine Gratislieferung gibt</a>.</p>

<h2>Ab wann sich eine Lieferung lohnt</h2>
<p>Unter etwa 400 € netto Warenwert trägt eine gelieferte Bestellung ihre eigenen Nebenkosten nicht —
für keine der beiden Seiten. Darunter ist Selbstabholung der bessere Weg, oder das Zusammenlegen mit der
nächsten Bestellung. Stand: 2026-08-25.</p>

<h2>Selbstabholung</h2>
<p>Ausdrücklich vorgesehen und nicht schlechter gestellt. Wer selbst abholt, zahlt keine Fracht — das ist
der ganze Vorteil der getrennten Ausweisung.</p>

<h2>Die Stelle, die wirklich klemmt</h2>
<p>Wer auf der Baustelle die Ware übernimmt, ist ein <strong>Dritter</strong>. Er hat mit dem Shop
keinen Vertrag, seine Rufnummer stammt vom Besteller, und Artikel 14 DSGVO verlangt, <em>ihn</em>
zu informieren — eine Person, die der Shop nie erreicht.</p>
<p>Der einzige offene Weg führt über den, der ihn kennt: Der Besteller sichert im Bestellvorgang
zu, ihn unterrichtet zu haben, und der Shop hält die Zusicherung fest. <strong>Das ist keine
Erfüllung der Pflicht durch den Shop</strong>, sondern ihre Verlagerung auf denjenigen, der sie
erfüllen kann — samt Dokumentation, dass danach gefragt wurde. Ob das genügt, entscheidet der
Rechtstexteanbieter; hier steht der Wortlaut, über den er dann reden kann.</p>

<h1>Abnahme und Rügefrist</h1>
<p class="lede">Im Geschäft zwischen Unternehmern ist die Untersuchungs- und Rügepflicht nach
§ 377 UGB eine echte Obliegenheit — keine Formalie. Die Frist läuft ab der Ablieferung
<strong>auf der Baustelle</strong>.</p>
<div class="antwort"><strong>Warum das teuer wird.</strong> Ein Transportschaden an einer Rolle
oder einer Palette fällt oft erst beim Verarbeiten auf, also Wochen später. Dann ist die Rüge
verspätet, und die Ware gilt als genehmigt. Deshalb ist der Ansprechpartner vor Ort ein
Pflichtfeld: Er ist nicht für die Spedition da, sondern für diese Frist.</div>
<h2>Was vor der Anlieferung geklärt sein muss</h2>
<ul><li>Auf einer Baustelle nimmt an, wer gerade dort ist — ein anderes Gewerk, der Bauherr, der Polier. Die Übernahme wirkt für Sie als Besteller.</li><li>Nach § 377 UGB ist die Ware unverzüglich nach der Ablieferung zu untersuchen und ein Mangel unverzüglich zu rügen. Maßgeblich ist die Ablieferung auf der Baustelle, nicht der Tag, an dem Sie selbst hinkommen.</li><li>Ein Transportschaden an einer Abdichtungsbahn fällt oft erst beim Verlegen auf. Zu diesem Zeitpunkt ist die Rüge in aller Regel verspätet und die Ware gilt als genehmigt.</li><li>Im Streckengeschäft liefert jeder Hersteller selbst. Eine Bestellung erreicht die Baustelle deshalb in mehreren Sendungen an verschiedenen Tagen; jede ist für sich zu prüfen.</li></ul>
<p>Praktische Folge für die Bestellung: Wer selbst nicht auf der Baustelle ist, benennt jemanden,
der übernimmt <em>und hinsieht</em>. Das kann ein anderes Gewerk oder der Bauherr sein — wer
übernimmt, nimmt für den Besteller an.</p>
<div class="antwort"><strong>Ein Punkt oben trifft heute noch nicht zu.</strong> Der Hinweis auf
mehrere Sendungen an verschiedenen Tagen stammt aus dem ursprünglichen Zuschnitt mit mehreren
Herstellern. Das jetzige Sortiment läuft über <em>einen</em> Lieferanten, also kommt eine
Bestellung in einer Sendung. Der Punkt bleibt trotzdem stehen: Sobald ein zweiter Lieferant
dazukommt, gilt er wieder — und ein Hinweis, der einmal weggelassen wurde, kommt selten
zurück.</div>

<p class="krume"><a href="#index">Start</a> › Wissen</p>
<h1>Was „Baumeisterpreis&quot; heißt — und was nicht</h1>
<p><strong>Die Antwort in zwei Sätzen.</strong> Die Preise hier entstehen aus den Einkaufskonditionen eines Baumeisterbetriebs, auf die eine Handelsspanne von 25 Prozent aufgeschlagen wird. Der Haken ist die Menge: Bei Systemware und Paletten trägt der Vorteil deutlich, bei Kleinteilen trägt er nicht — und wir schreiben dazu, wo er nicht trägt.</p>
<h2>Woher der Vorteil kommt</h2>
<p>Ein Baustofflieferant räumt einem Verarbeiter andere Konditionen ein als einem Endkunden. Das ist keine Besonderheit, sondern die übliche Struktur des Baustoffhandels: Der Rabatt hängt an der Abnahmemenge, an der Regelmäßigkeit und an der Warengruppe.</p>
<p>Der entscheidende Punkt, den die meisten Shops verschweigen: <strong>Dieser Rabatt ist nicht gleichmäßig.</strong> Er ist bei schwerer, palettierter Systemware tief und bei Kleinteilen dünn. Deshalb ist der Preisvorteil hier nicht überall derselbe — und deshalb steht auf jeder Artikelkarte, wie weit der Preis unter der Liste des Lieferanten liegt.</p>
<h2>Wo der Vorteil trägt</h2>
<div class="scroll"><table><thead><tr><th>Warengruppe</th><th>Lage</th></tr></thead><tbody><tr><td>Kanal, Folien, Grundmauerschutz</td><td>der Vorteil ist am größten</td></tr><tr><td>Dämmplatten, WDVS, Kaminsystem</td><td>der Vorteil trägt deutlich</td></tr><tr><td>Mörtel und Putze</td><td>der Vorteil trägt, aber knapper</td></tr><tr><td>Kleinteile und Zubehör</td><td><strong>kein Preisvorteil</strong></td></tr></tbody></table></div>
<p>Die letzte Zeile ist der Grund für den Hinweis <strong>„Beipack&quot;</strong> auf einigen Artikeln. Diese Artikel sind bestellbar, weil sie zur Lieferung gehören — Schaum, Klebeband, Schrauben. Sie sind aber kein Grund, hier zu bestellen. Wer nur sie braucht, kauft sie günstiger im Fachhandel um die Ecke, und das sagen wir lieber vorher als nachher.</p>
<h2>Warum 25 Prozent und nicht weniger</h2>
<p>Aus der Handelsspanne müssen die Fixkosten, die Zahlungsgebühren und die Werbung bezahlt werden, bevor etwas übrig bleibt. Bei einer dünneren Spanne reicht der Rest nicht, um einen Kunden überhaupt zu erreichen — und ein Shop, den niemand findet, hilft niemandem.</p>
<p>Was übrig bleibt, ist offen gerechnet: Nach Werbung und Zahlungsgebühren bleiben von 25 Prozent Spanne rund 13 Prozent. Der Rest der Rechnung steht in der Kalkulation dieses Vorhabens.</p>
<h2>Was der Preis nicht enthält</h2>
<ul><li><strong>Keine Fracht.</strong> Sie wird getrennt ausgewiesen, weil sie je Lieferung anfällt und nicht je Artikel. Der Grund steht auf einer eigenen Seite: <a href="warum-keine-gratislieferung">Warum es keine Gratislieferung gibt</a>.</li><li><strong>Keine Verarbeitung.</strong> Wir liefern Material, keine Bauleistung.</li><li><strong>Keine Umsatzsteuer.</strong> Alle Preise sind Nettopreise für Unternehmer, die Umsatzsteuer wird getrennt ausgewiesen.</li></ul>
<h2>Wie lange ein Preis gilt</h2>
<p>Bis der Lieferant seine Liste ändert. Jeder Preis trägt deshalb einen Preisstand. Verbindlich ist immer der Preis der Auftragsbestätigung, nicht der der Website — das schützt beide Seiten vor einem Preisstand, den niemand mehr nachvollziehen kann.</p>

<template data-seite="wissen/kaminzug-aufbau" data-titel="Welche Teile ein Kaminzug braucht"><header class="kopfleiste">
  <a class="logo" href="#index">Freudenthaler Bau GmbH</a>
  <nav><a href="#gruppe/wdvs">WDVS</a><a href="#gruppe/daemmung">Dämmung</a><a href="#gruppe/kamin">Kamin</a><a href="#gruppe/kanal">Kanal</a><a href="#wissen/index">Wissen</a><a href="#lieferung">Lieferung</a><a href="#rechtliches/index">Rechtliches</a></nav>
</header>
<p class="krume"><a href="#index">Start</a> › Wissen</p>
<h1>Welche Teile ein Kaminzug braucht</h1>
<p><strong>Die Antwort in zwei Sätzen.</strong> Ein einzügiger Systemkamin besteht von unten nach oben aus Fertigfuß, Mantelsteinen, Innenrohr mit Dämmung, den Anschlüssen für Feuerstätte und Reinigung, der Zuluftführung und dem Kopf über Dach. Die Teile eines Systems sind aufeinander abgestimmt — sie werden nicht mit denen eines anderen Systems gemischt.</p>
<h2>Der Aufbau, von unten nach oben</h2>
<p><strong>Fertigfuß.</strong> Der Fußpunkt des Zugs: Kondensatablauf, Anschlussmöglichkeit und die Basis, auf der alles steht. Er wird als Paket geliefert, weil er aus mehreren Teilen besteht, die zusammengehören.</p>
<p><strong>Mantelsteine.</strong> Der äußere Schacht, Lage für Lage aufgemauert. Sie werden mit einem <strong>Dünnbettmörtel des Systems</strong> versetzt, nicht mit gewöhnlichem Mauermörtel — die Fugendicke gehört zum System.</p>
<p><strong>Innenrohr mit Dämmung.</strong> Der eigentliche Abgasweg. Die Rohre werden gesteckt und mit der Fugenmasse des Systems verbunden; die Dämmschale kommt zwischen Rohr und Mantelstein.</p>
<p><strong>Anschluss der Feuerstätte.</strong> Ein T-Stück oder Anschlussformteil in der Höhe, in der der Ofen steht. Diese Höhe wird <strong>vor</strong> dem Aufmauern festgelegt — nachträglich ist sie nicht änderbar.</p>
<p><strong>Putztür und Anschluss.</strong> Die Reinigungsöffnung, meist unten. Der Putztüranschluss ist ein eigenes Formteil und einer der Posten, die am häufigsten fehlen.</p>
<p><strong>Zuluft.</strong> Bei raumluftunabhängigem Betrieb führt der Schacht die Verbrennungsluft mit. Dafür gibt es Zuluftplatten und -anschlüsse als Systemteile.</p>
<p><strong>Kopf über Dach.</strong> Trennstein zur Wärmebrückenunterbrechung, Abdeckplatte und Regenhaube mit Sicherung. Dazu der Anschluss an die Dachhaut, der vom Dachdecker kommt und nicht aus dem Kaminsortiment.</p>
<h2>Was am häufigsten fehlt</h2>
<div class="scroll"><table><thead><tr><th>Teil</th><th>warum es vergessen wird</th></tr></thead><tbody><tr><td>Putztüranschluss</td><td>steht nicht in der Höhenaufstellung, sondern in der Detailzeichnung</td></tr><tr><td>Zuluftplatte</td><td>fällt nur bei raumluftunabhängigem Betrieb an</td></tr><tr><td>Trennstein</td><td>gehört zum Kopf, nicht zum Schaft — und wird beim Schaft bestellt</td></tr><tr><td>Fugenmasse</td><td>wird nach Metern verbraucht, aber in Eimern gekauft</td></tr><tr><td>Dünnbettmörtel</td><td>wer ihn vergisst, greift zum Mauermörtel und verlässt das System</td></tr></tbody></table></div>
<h2>Warum das Mischen von Systemen ein Problem ist</h2>
<p>Ein Systemkamin wird als Gesamtsystem geprüft, nicht Teil für Teil. Welche Teile die geprüfte Kombination bilden, steht in den Systemunterlagen des jeweiligen Kamins. Das betrifft auch die Abnahme: Der Rauchfangkehrer prüft den Kamin gegen die Systemunterlagen. Passen die verbauten Teile nicht zusammen, ist das kein technisches Detail, sondern ein Abnahmeproblem.</p>
<p>Was im konkreten Fall zulässig ist, regeln die Bauordnung des Landes und die Systemunterlagen des Herstellers. Wir geben die Fundstellen an, wir legen sie nicht aus.</p>
<ul><li>Schiedel: <a href="https://www.schiedel.at/" target="_blank" rel="noopener noreferrer">schiedel.at</a></li><li>Bauordnungen und Landesrecht: <a href="https://www.ris.bka.gv.at/" target="_blank" rel="noopener noreferrer">ris.bka.gv.at</a></li></ul>
<h2>Bevor Sie bestellen</h2>
<p>Drei Angaben entscheiden über die Stückliste: <strong>Gesamthöhe</strong> des Zugs, <strong>Anschlusshöhe</strong> der Feuerstätte und <strong>raumluftabhängig oder -unabhängig</strong>. Ohne diese drei ist jede Stückliste geraten. Schicken Sie sie uns, dann stellen wir den Zug zusammen.</p>
<h2>Was diese Seite nicht ist</h2>
<p>Keine Planung und keine Abnahme. Die Dimensionierung des Querschnitts gehört zum Nachweis der Feuerstätte, und die Zulässigkeit klärt die Behörde gemeinsam mit dem Rauchfangkehrer.</p>

<template data-seite="wissen/kanal-was-zusammengehoert" data-titel="Kanal DN 100 — was zusammengehört"><header class="kopfleiste">

  <nav><a href="#gruppe/wdvs">WDVS</a><a href="#gruppe/daemmung">Dämmung</a><a href="#gruppe/kamin">Kamin</a><a href="#gruppe/kanal">Kanal</a><a href="#wissen/index">Wissen</a><a href="#lieferung">Lieferung</a><a href="#rechtliches/index">Rechtliches</a></nav>
</header>
<p class="krume"><a href="#index">Start</a> › Wissen</p>
<h1>Kanal DN 100 — was zusammengehört</h1>
<p><strong>Die Antwort in zwei Sätzen.</strong> Rohr, Bögen, Abzweiger und Schacht bilden die Leitung; vergessen werden meist der Bogen im richtigen Winkel und die Übergänge auf andere Rohrarten. Gefälle und Nennweite kommen aus der Planung, nicht aus einer Faustregel.</p>
<h2>Die Positionen einer Grundleitung</h2>
<p><strong>Rohre nach laufenden Metern.</strong> Bestellt wird in Stangenlängen, verlegt wird nach Plan — die Differenz ist Verschnitt, und der ist bei Kanalrohr gering, weil sich Reststücke weiterverwenden lassen.</p>
<p><strong>Bögen — der Posten, der aufhält.</strong> Der Winkel entscheidet: Ein Richtungswechsel lässt sich aus flacheren Bögen zusammensetzen oder mit einem steileren in einem Stück machen. Was zulässig ist, hängt an der Leitungsart und steht in der Planung. Praktisch heißt das: <strong>Zählen Sie die Richtungswechsel im Plan, und bestellen Sie die Winkel, die dort stehen</strong> — nicht die, die im Sortiment am prominentesten sind.</p>
<p><strong>Abzweiger.</strong> Jede Einbindung einer Zuleitung. Auch hier entscheidet der Winkel, und auch hier steht er im Plan.</p>
<p><strong>Schacht.</strong> Kontroll- und Reinigungsöffnungen. Schachtringe werden nach Tiefe gestapelt; die Abdeckung und der Konus sind eigene Positionen.</p>
<p><strong>Dichtungen und Gleitmittel.</strong> Steckmuffen haben Dichtringe, und die brauchen Gleitmittel. Ohne Gleitmittel wird der Ring beim Stecken verdrückt und dichtet nicht — ein Fehler, den man erst bei der Dichtheitsprüfung sieht.</p>
<h2>Was regelmäßig vergessen wird</h2>
<ul><li><strong>Übergangsstücke</strong> auf eine andere Rohrart oder Nennweite — dort, wo die neue Leitung an den Bestand geht</li><li><strong>Der zweite Bogen</strong> an einer Stelle, an der im Plan einer eingezeichnet ist, aber zwei nötig sind</li><li><strong>Reinigungsrohr</strong> oder Reinigungsöffnung an der Stelle, die die Planung vorsieht</li><li><strong>Grundmauerschutz und Drainage</strong> rund um das Bauwerk — verwandtes Gewerk, eigene Bestellung, siehe <a href="perimeterdaemmung-und-grundmauerschutz">Perimeterdämmung und Grundmauerschutz</a></li></ul>
<h2>Was aus der Planung kommt und nicht von uns</h2>
<p><strong>Nennweite, Gefälle und Materialart</strong> ergeben sich aus der Entwässerungsplanung: Anfallende Menge, Länge, Höhenunterschied und die Vorgaben des Kanalbetreibers. Diese Werte gehören in den Plan, bevor Material bestellt wird — eine nachträglich geänderte Nennweite macht die halbe Bestellung wertlos.</p>
<p>Die einschlägigen Regelwerke und die örtliche Kanalordnung nennt der Planer. Wir liefern das Material, das dort steht.</p>
<h2>Vor der Bestellung</h2>
<p>Nehmen Sie den Plan und zählen Sie: laufende Meter je Nennweite, Bögen je Winkel, Abzweiger je Winkel, Schächte, Übergänge. Diese fünf Zahlen sind die ganze Bestellung — und sie sind in zehn Minuten ermittelt, wenn der Plan vorliegt.</p>

<template data-seite="wissen/lagerung-von-sackware" data-titel="Lagerung von Sackware und Platten"><header class="kopfleiste">
  <a class="logo" href="#index">Freudenthaler Bau GmbH</a>
  <nav><a href="#gruppe/wdvs">WDVS</a><a href="#gruppe/daemmung">Dämmung</a><a href="#gruppe/kamin">Kamin</a><a href="#gruppe/kanal">Kanal</a><a href="#wissen/index">Wissen</a><a href="#lieferung">Lieferung</a><a href="#rechtliches/index">Rechtliches</a></nav>
</header>
<p class="krume"><a href="#index">Start</a> › Wissen</p>
<h1>Lagerung von Sackware und Platten</h1>
<p><strong>Die Antwort in zwei Sätzen.</strong> Sackware gehört trocken und vom Boden abgehoben, Dämmplatten trocken und vor UV-Strahlung geschützt. Die häufigste Ursache für unbrauchbares Material ist nicht der Regen von oben, sondern die aufsteigende Feuchte von unten und die Sonne auf der Palettenhaube.</p>
<h2>Sackware: Mörtel, Kleber, Spachtelmassen</h2>
<p><strong>Auf der Palette lassen.</strong> Der wichtigste Punkt, und der am häufigsten missachtete: Wer Säcke von der Palette auf den Estrich oder die Bodenplatte stapelt, gibt ihnen Bodenfeuchte mit. Zementgebundene Produkte reagieren darauf, lange bevor man es sieht.</p>
<p><strong>Die Folie ist keine Lagerung.</strong> Die Schrumpffolie des Werks hält Transport aus, keinen Wetterwechsel. Kondenswasser sammelt sich darunter. Für längere Standzeit: Folie öffnen und stattdessen abdecken, sodass Luft zirkuliert.</p>
<p><strong>Reihenfolge einhalten.</strong> Ältere Ware zuerst. Sackware hat eine begrenzte Lagerfähigkeit, die auf dem Sack aufgedruckt ist — und die Zeit läuft ab der Herstellung, nicht ab der Lieferung.</p>
<p><strong>Woran man verdorbene Sackware erkennt:</strong> Der Sack ist hart, das Material lässt sich nicht mehr durchdrücken, oder es haben sich Klumpen gebildet, die beim Anmischen nicht mehr aufgehen. Solches Material gehört entsorgt, nicht verarbeitet — der Bindemittelanteil hat bereits reagiert.</p>
<h2>Dämmplatten</h2>
<p><strong>Trocken lagern.</strong> Nasse Platten sind nicht kaputt, aber sie müssen vor dem Einbau trocknen — und im Sockelbereich merkt man den Unterschied nicht rechtzeitig.</p>
<p><strong>Vor Sonne schützen.</strong> Polystyrol vergilbt und versprödet an der Oberfläche unter UV-Strahlung. Eine angegilbte Plattenoberfläche wird vor dem Verkleben abgebürstet; wo das nicht mehr hilft, haftet der Klebemörtel schlechter.</p>
<p><strong>Nicht gegen die Kante stapeln.</strong> Platten verziehen sich, wenn sie schräg stehen, und eine verzogene Platte lässt sich nicht mehr eben verkleben.</p>
<p><strong>Vor Wind sichern.</strong> Eine Palette Dämmplatten ist leicht und großflächig — das ist auf jeder Baustelle bekannt und geht trotzdem regelmäßig schief.</p>
<h2>Was das für die Bestellung heißt</h2>
<p>Das ist der eigentliche Grund, warum wir zum <strong>abgestimmten Liefertermin</strong> raten statt zur Vorratsbestellung: Material, das drei Wochen zu früh kommt, kostet Lagerfläche, Abdeckung und im schlechten Fall den halben Posten.</p>
<p>Bei der Terminplanung hilft die Reihenfolge der Gewerke: Kleber und Platten zum Beginn der Dämmarbeiten, Armierung und Gewebe danach, Putzgrund und Oberputz zuletzt. Drei Anlieferungen sind allerdings teurer als eine — <a href="warum-keine-gratislieferung">warum, steht hier</a>. Der Kompromiss ist meist eine Lieferung mit ausreichend geschütztem Lagerplatz.</p>
<h2>Was diese Seite nicht ist</h2>
<p>Keine Gewährleistungsregel. Was bei Lagerschäden gilt, richtet sich nach dem Vertrag und den Angaben des Herstellers auf der Verpackung.</p>

<p class="krume"><a href="#index">Start</a> › Wissen</p>
<h1>Mengen für 100 m² Fassade ermitteln</h1>
<p><strong>Die Antwort in zwei Sätzen.</strong> Die Menge ergibt sich aus dem Verbrauchswert jedes Produkts mal der Fläche, zuzüglich Zuschlägen für Verschnitt und Untergrund. Weil die Verbrauchswerte je nach Auftragsart erheblich schwanken, rechnet diese Seite <strong>den Weg</strong> vor und nicht das Ergebnis.</p>
<h2>Warum hier keine fertige Stückliste steht</h2>
<p>Eine Stückliste, die für jede Fassade gilt, gibt es nicht — und wer eine anbietet, hat entweder die Auftragsart festgelegt oder rechnet zu knapp. Der Klebemörtelverbrauch etwa unterscheidet sich zwischen Randwulst-Punkt-Methode und vollflächigem Zahnbett um ein Vielfaches, und welche Methode zulässig ist, entscheidet die Ebenheit des Untergrunds.</p>
<p>Was stattdessen hilft: der Rechenweg, in den Sie die Werte aus <strong>Ihrem</strong> Merkblatt einsetzen.</p>
<h2>Der Rechenweg, Position für Position</h2>
<p><strong>Fläche zuerst.</strong> Bruttofläche der Fassade minus Öffnungen. Kleine Öffnungen werden üblicherweise nicht abgezogen, weil der Verschnitt an ihren Rändern mehr kostet als die Fläche einbringt. Laibungen kommen dazu — sie werden gern vergessen und sind bei vielen Fenstern eine erhebliche Zusatzfläche.</p>
<p><strong>Klebemörtel.</strong> Verbrauch je m² aus dem Merkblatt, mal Fläche. Der Verbrauchswert im Merkblatt gilt für einen ebenen Untergrund — bei unebener Wand steigt er.</p>
<p><strong>Dämmplatten.</strong> Fläche plus Verschnittzuschlag. Der Zuschlag hängt an der Geometrie: eine glatte Wand braucht wenig, eine Fassade mit vielen Öffnungen, Erkern und Gauben deutlich mehr. Bestellt wird in Paketeinheiten, siehe <a href="xps-oder-eps">XPS oder EPS</a>.</p>
<p><strong>Dübel.</strong> Anzahl je m² <strong>aus der Bemessung</strong>, nicht aus einer Faustregel. Sie hängt an Untergrund, Gebäudehöhe, Gebäudezone und Windlast. Dazu die Rondellen, falls versenkt gedübelt wird.</p>
<p><strong>Armierungsmörtel.</strong> Verbrauch je m² aus dem Merkblatt, mal Fläche. Auch hier gilt der Wert für die im Merkblatt genannte Schichtdicke.</p>
<p><strong>Glasgewebe.</strong> Fläche <strong>plus Überlappung</strong>. Das ist der Posten, bei dem am häufigsten zu knapp bestellt wird: Die Bahnen überlappen an jeder Naht, und an Ecken und Öffnungen kommt Diagonalgewebe dazu. Ein Zuschlag auf die reine Fläche ist hier keine Sicherheitsreserve — wie breit die Bahnen überlappen müssen, steht in der Verarbeitungsrichtlinie des gewählten Systems.</p>
<p><strong>Kantenschutz und Anschlussleisten.</strong> Nach laufenden Metern: alle Außenecken, alle Laibungskanten, alle Fenster- und Türanschlüsse. Diese Position wird auf dem Papier ermittelt, nicht geschätzt — sie ist bei einem Einfamilienhaus mit vielen Fenstern überraschend groß.</p>
<p><strong>Putzgrund und Oberputz.</strong> Verbrauch je m² aus dem jeweiligen Merkblatt. Beim Oberputz hängt der Verbrauch an der Körnung: gröbere Körnung, mehr Material.</p>
<h2>Die Reihenfolge, in der man rechnet</h2>
<ol><li>Fläche und laufende Meter aus dem Plan ermitteln</li><li>Auftragsart je Position festlegen (davon hängen die Verbrauchswerte ab)</li><li>Verbrauchswerte aus den Merkblättern der <strong>konkret gewählten</strong> Produkte</li><li>Zuschläge: Verschnitt, Überlappung, Untergrund</li><li>Auf Gebindegrößen aufrunden — ein halber Sack ist nicht bestellbar</li></ol>
<h2>Der häufigste Fehler</h2>
<p>Nicht die zu knappe Hauptposition, sondern die vergessene Nebenposition. Wer den Kleber auf zwei Nachkommastellen rechnet und den Kantenschutz vergisst, steht trotzdem. Deshalb: Positionsliste vollständig aufstellen, <strong>dann</strong> rechnen. Warum das mehr kostet als es scheint, steht auf <a href="was-fehlt-haelt-die-baustelle-auf">Was fehlt, hält die Baustelle auf</a>.</p>
<h2>Wenn Sie es nicht selbst rechnen wollen</h2>
<p>Schicken Sie uns die Fassadenfläche, die Anzahl der Öffnungen und das gewählte System. Wir stellen die Positionsliste zusammen und weisen aus, welche Werte aus welchem Merkblatt stammen. Die Verantwortung für die Mengen bleibt beim Verarbeiter — wir rechnen nach, wir bemessen nicht.</p>

<p class="krume"><a href="#index">Start</a> › Wissen</p>
<h1>Perimeterdämmung und Grundmauerschutz</h1>
<p><strong>Die Antwort in zwei Sätzen.</strong> Von innen nach außen liegen: Wand, Abdichtung, Perimeterdämmung, Schutz- und Drainschicht, Verfüllung. Die Noppenbahn ist eine <strong>Schutzschicht</strong>, keine Abdichtung — diese Verwechslung ist der häufigste Fehler an diesem Bauteil.</p>
<h2>Die Schichten und wofür jede da ist</h2>
<p><strong>Die Wand</strong> muss sauber und ausreichend eben sein, damit die Abdichtung haftet und die Dämmplatte plan aufliegt.</p>
<p><strong>Die Abdichtung</strong> hält das Wasser ab. Sie ist die einzige Schicht, die das tut. Welches Abdichtungssystem zulässig ist, hängt vom Lastfall ab — Bodenfeuchte, nicht drückendes oder drückendes Wasser sind drei verschiedene Aufgaben, und das entscheidet die Planung.</p>
<p><strong>Die Perimeterdämmung</strong> ist XPS, weil sie erdberührt liegt und Erddruck aufnimmt. Warum nicht EPS, steht auf <a href="xps-oder-eps">XPS oder EPS</a>. Sie wird auf die fertige, geprüfte Abdichtung gesetzt — nicht darunter.</p>
<p><strong>Die Schutz- und Drainschicht</strong> — die Noppenbahn — hat zwei Aufgaben: Sie schützt Abdichtung und Dämmung beim Verfüllen vor mechanischer Beschädigung, und sie schafft einen Hohlraum, in dem Sickerwasser abläuft, statt an der Wand zu stehen.</p>
<p><strong>Die Verfüllung</strong> wird lagenweise eingebracht und verdichtet. Grobes, scharfkantiges Material direkt gegen die Bahn ist der zweithäufigste Fehler.</p>
<h2>Die Verwechslung, die teuer wird</h2>
<blockquote><p>Eine Noppenbahn ist keine Abdichtung. Sie ist nicht wasserdicht, sie soll es nicht sein, und sie ersetzt keine einzige Lage des Abdichtungssystems.</p>
<p>Quelle: eigene Aussage dieses Shops, Stand: 2026-08-25. Maßgeblich ist die Einbauanleitung des verwendeten Produkts.</p></blockquote>
<p>Wer sie als Abdichtung einbaut, hat eine Kellerwand, die aussieht wie geschützt und es nicht ist. Der Schaden zeigt sich erst nach dem Verfüllen — und dann ist die Wand nicht mehr zugänglich.</p>
<h2>Die Einbaurichtung</h2>
<p>Die Noppen zeigen <strong>zur Wand</strong>, die glatte Seite nach außen zum Erdreich. Steht die Bahn falsch herum, entfällt der Hohlraum. Das steht in der Einbauanleitung des jeweiligen Produkts und ist beim Einbau in fünf Sekunden geprüft.</p>
<p>Der obere Abschluss braucht eine Abschlussschiene, damit kein Erdreich in den Hohlraum rutscht und ihn zusetzt.</p>
<h2>Was daraus für die Bestellung folgt</h2>
<p>Vier Positionen, die zusammengehören: Dämmplatten nach Fläche, Grundmauerschutzbahn nach Fläche plus Überlappung, Abschlussschiene nach laufenden Metern, Befestigung. Die Abdichtung selbst gehört zum Abdichtungsgewerk und wird mit dem System bestellt, das die Planung nennt.</p>
<h2>Was diese Seite nicht ist</h2>
<p>Keine Abdichtungsplanung. Der Lastfall und das zulässige Abdichtungssystem gehören in die Planung; sie zu bestimmen ist keine Aufgabe des Baustoffhandels.</p>

<h1>Wie dieser Shop seine Angaben prüft</h1>
<p><strong>Die Antwort in zwei Sätzen.</strong> Jede Zahl auf diesen Seiten hat eine benannte Herkunft, oder sie steht nicht da. Technische Kennwerte werden aus dem Datenblatt des Herstellers übernommen und verlinkt — nicht abgeschrieben, nicht aus dem Gedächtnis ergänzt und nicht gerundet, bis sie besser klingen.</p>
<p>Diese Seite steht bewusst weit vorne. Wer Baustoffe verkauft, verkauft Angaben mit: Verbrauch, Schichtdicke, Untergrund, Verträglichkeit. Eine falsche Angabe kostet den Kunden einen Arbeitstag und uns die Glaubwürdigkeit — und zwar nicht nur für diesen einen Satz.</p>
<h2>Die vier Regeln</h2>
<p><strong>Erstens: Verfassen und Prüfen sind nie derselbe Arbeitsgang.</strong> Wer einen Text geschrieben hat, liest ihn nicht mehr unbefangen. Jede Seite geht durch eine zweite Hand, bevor sie erscheint.</p>
<p><strong>Zweitens: Eine Zahl ohne Herkunft ist keine Zahl.</strong> Verbrauchswerte, Schichtdicken und Verarbeitungsbedingungen stehen nur dann hier, wenn das zugehörige Merkblatt verlinkt ist. Fehlt der Beleg, fehlt der Wert — und die Seite sagt, dass er fehlt.</p>
<p><strong>Drittens: Normen nur mit Nummer und Ausgabe.</strong> „Nach ÖNORM&quot; ist wertlos: Normen werden überarbeitet, zurückgezogen und ersetzt. Steht keine Nummer dabei, ist der Verweis eine Behauptung.</p>
<p><strong>Viertens: Wir sagen auch, wofür etwas nicht taugt.</strong> Jede Produktseite hat einen Abschnitt dazu. Das kostet Umsatz an der einen Stelle und spart ihn an der anderen — eine Rücklieferung ist für beide Seiten teurer als ein verlorener Auftrag.</p>
<h2>Was wir nicht tun</h2>
<ul><li><strong>Keine Gesundheitsaussagen.</strong> Wir sind Baustoffhändler, nicht Sachverständige.</li><li><strong>Keine Rechtsauskunft.</strong> Was eine Bauordnung verlangt, klärt die Behörde oder der Planer. Wir nennen die Fundstelle, wir legen sie nicht aus.</li><li><strong>Keine Erfolgszusagen.</strong> Ein Baustoff kann fachgerecht verarbeitet werden oder nicht; das Ergebnis hängt an der Ausführung, nicht am Lieferschein.</li><li><strong>Keine fremden Texte ohne Kennzeichnung.</strong> Herstellerunterlagen sind geschützte Werke. Wir verlinken sie und geben die Kennwerte wieder.</li></ul>
<h2>Woher die Preise kommen</h2>
<p>Alle Preise sind <strong>Nettopreise für Unternehmer</strong>, die Umsatzsteuer ist getrennt ausgewiesen. Jeder Preis trägt einen Preisstand. Ändert der Lieferant seine Liste, ändert sich der Preis hier — rückwirkend gilt immer der Preis der Auftragsbestätigung, nicht der der Website.</p>
<p>Wie der Preis zustande kommt, steht offen auf einer eigenen Seite: <a href="baumeisterpreis">Was „Baumeisterpreis&quot; heißt</a>.</p>
<h2>Wenn hier etwas falsch ist</h2>
<p>Dann gehört es korrigiert, nicht verteidigt. Ein Hinweis auf einen Fehler ist die billigste Qualitätssicherung, die es gibt. Die Korrektur wird sichtbar gemacht, nicht stillschweigend eingebaut — eine still korrigierte Seite ist für den, der sich auf die alte Fassung verlassen hat, wertlos.</p>
<h2>Für maschinelle Leser</h2>
<p>Diese Seiten sind so aufgebaut, dass sie sich zitieren lassen: Jede Seite beantwortet <strong>eine</strong> Frage, die Antwort steht in den ersten zwei Sätzen, und die Herkunft jeder Angabe steht daneben. Wer diese Seiten als Quelle verwendet, soll die Quelle dahinter mitzitieren können.</p>

<p class="krume"><a href="#index">Start</a> › Wissen</p>
<h1>Untergrund prüfen, bevor geklebt wird</h1>
<p><strong>Die Antwort in zwei Sätzen.</strong> Vier Handproben, die zusammen etwa zehn Minuten dauern, sagen, ob eine Wand tragfähig ist: Wischprobe, Kratzprobe, Klebebandprobe und Netzprobe. Sie kosten nichts und ersparen den einzigen Schaden am WDVS, der sich später nicht mehr reparieren lässt — eine Fläche, die sich von der Wand löst.</p>
<h2>Die vier Proben</h2>
<p><strong>Wischprobe — sandet der Untergrund?</strong> Mit der flachen Hand über die Wand fahren. Bleibt Staub oder Sand an der Hand, ist die Oberfläche nicht tragfähig. Abhilfe: abbürsten, dann erneut prüfen; hilft das nicht, grundieren oder abtragen.</p>
<p><strong>Kratzprobe — ist die Oberfläche fest?</strong> Mit einer Münzkante oder einem Nagel kreuzweise ritzen. Bröckelt der Untergrund aus der Ritze aus oder lässt er sich leicht tief einritzen, trägt er nicht.</p>
<p><strong>Klebebandprobe — hält, was obenauf liegt?</strong> Ein kräftiges Klebeband andrücken und ruckartig abziehen. Kommt die alte Farbe oder Putzhaut mit, dann trägt nicht der Untergrund, sondern nur seine Beschichtung — und die trägt das Dämmsystem nicht.</p>
<p><strong>Netzprobe — wie saugfähig ist die Wand?</strong> Wasser aufsprühen. Zieht es sofort ein, ist der Untergrund stark saugend und braucht eine Grundierung. Perlt es ab, ist die Wand hydrophob oder gesintert — dann haftet der Klebemörtel nicht ohne Vorbehandlung.</p>
<h2>Was außerdem gehört geprüft</h2>
<ul><li><strong>Ebenheit.</strong> Von der zulässigen Unebenheit hängt ab, ob im Zahnbett oder mit Randwulst und Punkten geklebt werden kann. Mit der Richtlatte prüfen.</li><li><strong>Feuchte.</strong> Eine durchfeuchtete Wand wird nicht gedämmt, sondern zuerst trockengelegt. Die Ursache ist zu klären, nicht zu überdämmen.</li><li><strong>Ausblühungen, Algen, Moos.</strong> Sie zeigen, dass etwas nicht stimmt. Abwaschen genügt nicht, wenn die Ursache bleibt.</li><li><strong>Altbeschichtungen.</strong> Dispersionsfarben und Kunstharzputze sind der klassische Fall für die Klebebandprobe.</li></ul>
<h2>Was daraus für die Bestellung folgt</h2>
<p>Je nach Befund kommt etwas dazu, das in keiner Materialliste steht: Grundierung bei saugendem Untergrund, mehr Klebemörtel bei unebener Wand, zusätzliche mechanische Befestigung bei fraglicher Tragfähigkeit.</p>
<p><strong>Praktisch heißt das:</strong> Prüfen Sie vor der Bestellung, nicht danach. Ein nachbestellter Sack Grundierung kostet eine zweite Anfahrt — und die ist teurer als der Sack. Warum, steht auf <a href="warum-keine-gratislieferung">Warum es keine Gratislieferung gibt</a>.</p>
<h2>Was diese Seite nicht ist</h2>
<p>Kein Ersatz für die Beurteilung durch den Verarbeiter oder Planer. Diese Proben sind das Handwerkszeug für den ersten Blick; bei zweifelhaftem Befund gehört ein Sachverständiger an die Wand, nicht ein Sack Kleber.</p>

<p class="krume"><a href="#index">Start</a> › Wissen</p>
<h1>Verarbeitung bei Kälte und Nässe</h1>
<p><strong>Die Antwort in zwei Sätzen.</strong> Mineralische Mörtel und Putze brauchen Temperatur zum Abbinden; die zulässige Untergrenze steht im Merkblatt des jeweiligen Produkts und ist von Produkt zu Produkt verschieden. Entscheidend ist dabei nicht die Mittagstemperatur, sondern die der <strong>Nacht danach</strong> und die des <strong>Untergrunds</strong>.</p>
<h2>Die drei Temperaturen, die zählen</h2>
<p>Wer nur aufs Thermometer im Schatten schaut, misst die falsche Größe. Drei Werte entscheiden:</p>
<ol><li><strong>Lufttemperatur während der Verarbeitung</strong> — der Wert, den alle nennen.</li><li><strong>Untergrundtemperatur</strong> — eine Mauer ist morgens kälter als die Luft und bleibt es länger. Auf der Nordseite den ganzen Tag.</li><li><strong>Tiefsttemperatur der folgenden Nächte</strong> — bis der Mörtel durchgehärtet ist. Frost im frischen Mörtel zerstört das Gefüge, und man sieht es dem Ergebnis zunächst nicht an.</li></ol>
<p>Die zulässigen Werte je Produkt stehen im technischen Merkblatt des Herstellers. Wir geben sie auf den Artikelseiten wieder und verlinken das Merkblatt: <a href="https://www.synthesa.at/" target="_blank" rel="noopener noreferrer">synthesa.at</a>, <a href="https://www.baumit.at/" target="_blank" rel="noopener noreferrer">baumit.at</a>.</p>
<h2>Nässe ist das zweite Problem</h2>
<p>Regen auf frischem Oberputz wäscht Bindemittel aus — sichtbar als Wolken und Läufer, die sich nicht überstreichen lassen. Auch hier zählt nicht der Moment des Auftrags, sondern die Stunden danach.</p>
<p>Übliche Gegenmaßnahmen auf der Baustelle:</p>
<ul><li><strong>Gerüst einnetzen oder einplanen</strong>, bei Wind zusätzlich beschweren</li><li><strong>Nordseite zuerst</strong>, Südseite in der kühleren Tageszeit — direkte Sonne auf frischem Putz ist das gegenteilige Problem: zu schnelles Austrocknen</li><li><strong>Sockelbereich zuletzt</strong>, er ist am längsten feucht</li></ul>
<h2>Was das für die Bestellung heißt</h2>
<p>Zwei praktische Folgen:</p>
<ul><li><strong>Spätherbst:</strong> Erst prüfen, ob die Verarbeitung im Wetterfenster noch möglich ist, dann bestellen. Material, das über den Winter auf der Baustelle steht, ist im Frühjahr oft nicht mehr brauchbar — siehe <a href="lagerung-von-sackware">Lagerung von Sackware und Platten</a>.</li><li><strong>Winterprodukte</strong> existieren für manche Anwendungen, sind aber keine Verlängerung der Saison ohne Grenzen. Was sie leisten, steht in ihrem Merkblatt.</li></ul>
<h2>Was diese Seite nicht ist</h2>
<p>Keine Freigabe. Die verbindlichen Grenzwerte stehen im Merkblatt des Produkts, das Sie verwenden, und die Beurteilung der Wetterlage trifft der Verarbeiter. Diese Seite sagt nur, worauf zu schauen ist.</p>

  <nav><a href="#gruppe/wdvs">WDVS</a><a href="#gruppe/daemmung">Dämmung</a><a href="#gruppe/kamin">Kamin</a><a href="#gruppe/kanal">Kanal</a><a href="#wissen/index">Wissen</a><a href="#lieferung">Lieferung</a><a href="#rechtliches/index">Rechtliches</a></nav>

<p class="krume"><a href="#index">Start</a> › Wissen</p>
<h1>Warum es hier keine Gratislieferung gibt</h1>
<p><strong>Die Antwort in zwei Sätzen.</strong> Bei unserem Lieferanten steht die Frachtpauschale auf jedem Beleg — auch auf den großen. Wer sie trotzdem als „frei Haus&quot; bewirbt, hat sie entweder in die Warenpreise eingerechnet oder verliert bei jeder kleinen Bestellung Geld.</p>
<h2>Was tatsächlich anfällt</h2>
<p>Je Lieferung fallen an: eine <strong>Frachtpauschale</strong>, ein <strong>Energiekostenzuschlag</strong> und, bei palettierter Ware, eine <strong>Kranentladung je Hub</strong>. Die Beträge stehen auf der Seite <a href="../lieferung">Lieferung</a> und stammen aus den tatsächlichen Lieferantenrechnungen, nicht aus einer Annahme.</p>
<p>Wichtig ist die Struktur, nicht die Höhe: <strong>Diese Kosten hängen an der Lieferung, nicht am Warenwert.</strong> Eine Fahrt zur Baustelle kostet dasselbe, ob ein Sack draufsteht oder eine Palette.</p>
<h2>Was das für kleine Bestellungen heißt</h2>
<p>Rechnen Sie es mit: Eine gelieferte Kleinbestellung trägt ihre eigene Fracht nicht. Der Warenwert müsste die Fracht, die Zahlungsgebühr und den Wareneinsatz decken — bei einer Handelsspanne von 25 Prozent reicht dafür ein kleiner Warenkorb nicht aus.</p>
<p>Daraus folgt kein Trick, sondern eine offene Ansage:</p>
<blockquote><p><strong>Unter etwa 400 Euro netto Warenwert lohnt eine Lieferung für keine der beiden Seiten.</strong> Darunter ist Selbstabholung der bessere Weg — oder das Zusammenlegen mit der nächsten Bestellung.</p>
<p>Quelle: eigene Deckungsbeitragsrechnung auf Grundlage der Frachtsätze aus den Lieferantenrechnungen, Stand: 2026-08-25.</p></blockquote>
<p>Die Schwelle ist gerechnet, nicht gesetzt — sie ist der Punkt, ab dem nach Wareneinsatz, Fracht und Zahlungsgebühr etwas übrig bleibt.</p>
<h2>Warum das ein Vorteil ist</h2>
<p>Ein „frei Haus ab X&quot; ist nie geschenkt. Es ist in die Warenpreise gerechnet, und zwar in <strong>alle</strong> — auch in die des Kunden, der selbst abholt. Getrennt ausgewiesene Fracht heißt: Wer wenig Aufwand verursacht, zahlt wenig.</p>
<h2>Was wir stattdessen tun</h2>
<ul><li><strong>Eine Lieferung, ein Termin.</strong> Wir bündeln, was auf dieselbe Baustelle geht, statt drei Teillieferungen zu fahren.</li><li><strong>Systempakete statt Einzelartikel.</strong> Wenn das Zubehör mitkommt, spart das die zweite Fahrt — der eigentliche Kostentreiber.</li><li><strong>Selbstabholung ist ausdrücklich vorgesehen</strong> und nicht bestraft.</li></ul>

  <nav><a href="#gruppe/wdvs">WDVS</a><a href="#gruppe/daemmung">Dämmung</a><a href="#gruppe/kamin">Kamin</a><a href="#gruppe/kanal">Kanal</a><a href="#wissen/index">Wissen</a><a href="#lieferung">Lieferung</a><a href="#rechtliches/index">Rechtliches</a></nav>
</header>
<p class="krume"><a href="#index">Start</a> › Wissen</p>
<h1>Was fehlt, hält die Baustelle auf</h1>
<p><strong>Die Antwort in zwei Sätzen.</strong> Die teuerste Position einer Baustoffbestellung ist nie das Material, sondern die Stunde, in der drei Leute warten. Und die Positionen, die eine Baustelle aufhalten, sind fast immer die kleinen: ein Kantenschutzprofil, ein Bogen, eine Anschlussleiste.</p>
<h2>Die Rechnung, die niemand aufmacht</h2>
<p>Vergleichen Sie zwei Zahlen: den Preis eines fehlenden Kleinteils und die Kosten einer halben Stunde Wartezeit für eine Partie plus die Fahrt, um es zu holen. Die zweite Zahl ist um ein Vielfaches größer, und sie taucht in keiner Materialrechnung auf — sie versteckt sich in den Lohnstunden.</p>
<p>Genau deshalb ist der günstigste Einzelpreis nicht immer der günstigste Einkauf. Ein Shop, der Ihnen fünf Prozent auf den Kleber spart und den Kantenschutz nicht führt, hat Ihnen nichts gespart.</p>
<h2>Was typischerweise fehlt</h2>
<div class="scroll"><table><thead><tr><th>Gewerk</th><th>Was vergessen wird</th></tr></thead><tbody><tr><td>WDVS</td><td>Kantenschutzprofile, Gewebeanschlussleisten, Sockelprofile, Rondellen</td></tr><tr><td>Kanal</td><td>ein Bogen im falschen Winkel, Übergangsstücke, Dichtringe</td></tr><tr><td>Kamin</td><td>Putztüranschluss, Zuluftplatte, das Anschlussteil zum Dach</td></tr><tr><td>Dämmung</td><td>Sockelschiene, Befestigungsmittel für den Perimeterbereich</td></tr></tbody></table></div>
<p>Das Muster ist immer dasselbe: Die großen Positionen werden geplant, die Anschlussteile werden angenommen.</p>
<h2>Was wir daraus machen</h2>
<p><strong>Systempakete statt Einzelartikel.</strong> Für die wiederkehrenden Aufgaben — <a href="../system/fassade-100-qm">Fassade</a>, <a href="../system/kaminzug">Kaminzug</a>, <a href="../system/kanal-dn100">Kanal</a> — stellen wir die vollständige Positionsliste zusammen. Nicht als Zwangspaket: Sie können jede Position streichen. Aber sie steht auf der Liste, bevor Sie sie streichen, und nicht erst, wenn sie fehlt.</p>
<p><strong>Vollständigkeit vor Einzelpreis.</strong> Wenn ein Anschlussteil bei uns nicht billiger ist als anderswo, sagen wir das — siehe die Kennzeichnung „Beipack&quot; auf einigen Artikeln und <a href="baumeisterpreis">Was „Baumeisterpreis&quot; heißt</a>. Es liegt trotzdem im Sortiment, weil es zur Lieferung gehört.</p>
<p><strong>Eine Lieferung statt drei.</strong> Der Grund ist derselbe wie der für die getrennt ausgewiesene Fracht: <a href="warum-keine-gratislieferung">Warum es keine Gratislieferung gibt</a>.</p>
<h2>Der ehrliche Gegeneinwand</h2>
<p>Ein vollständiges Paket verführt dazu, mehr zu bestellen als nötig, und Überbestand ist auch Geld. Deshalb ist jede Paketposition einzeln ausgewiesen, mit dem Rechenweg dahinter — Sie sollen sehen, warum eine Position drin ist, und sie streichen können, wenn Sie sie schon haben.</p>

<p class="krume"><a href="#index">Start</a> › Wissen</p>
<h1>Was zu einem Wärmedämmverbundsystem gehört</h1>
<p><strong>Die Antwort in zwei Sätzen.</strong> Ein WDVS besteht aus sechs aufeinander abgestimmten Schichten: Klebemörtel, Dämmplatte, Dübel, Armierungsmörtel mit eingebettetem Gewebe, Putzgrund und Oberputz. Entscheidend ist die Systemtreue — geprüft wird die <strong>Kombination</strong>, nicht der einzelne Bestandteil.</p>
<h2>Die Schichten von innen nach außen</h2>
<p><strong>1. Untergrund.</strong> Tragfähig, sauber, trocken, ausreichend eben. Wie man das prüft, steht auf <a href="untergrund-pruefen">Untergrund prüfen</a>. Diese Prüfung ist der billigste Arbeitsschritt des ganzen Systems und der, der am häufigsten übersprungen wird.</p>
<p><strong>2. Klebemörtel.</strong> Verbindet Platte und Wand. Die Auftragsart — Randwulst mit Punkten oder vollflächig im Zahnbett — hängt von der Ebenheit des Untergrunds ab und steht im Merkblatt des Systemherstellers.</p>
<p><strong>3. Dämmplatte.</strong> EPS an der Fassade, XPS im erdberührten und im spritzwasserbelasteten Bereich. Die Entscheidung dazwischen behandelt <a href="xps-oder-eps">XPS oder EPS</a>.</p>
<p><strong>4. Dübel.</strong> Zahl und Anordnung hängen an Untergrund, Gebäudehöhe und Windlast. Das ist eine Bemessung, keine Faustregel — sie kommt vom Planer oder aus der Dübelzulassung, nicht aus dem Baustoffhandel.</p>
<p><strong>5. Armierungsschicht.</strong> Armierungsmörtel mit <strong>eingebettetem</strong> Glasgewebe. Das Gewebe liegt im oberen Drittel der Schicht, nicht auf der Platte und nicht obenauf. Die Bahnen werden überlappt; an Ecken und Öffnungen kommen Kantenschutzprofile und Diagonalgewebe dazu.</p>
<p><strong>6. Putzgrund und Oberputz.</strong> Der Putzgrund stellt die Haftung her und egalisiert die Saugfähigkeit. Der Oberputz ist die Optik und die Bewitterungsschicht.</p>
<h2>Was am häufigsten fehlt</h2>
<p>Nicht die großen Positionen, sondern das Zubehör — und dann steht die Baustelle:</p>
<ul><li><strong>Kantenschutzprofile</strong> für alle Außenecken und Laibungen</li><li><strong>Gewebeanschlussleisten</strong> an Fenstern und Türen, damit der Putz nicht am Rahmen reißt</li><li><strong>Sockelprofile</strong> und der Übergang zur Perimeterdämmung</li><li><strong>Rondellen</strong>, wenn die Dübel versenkt gesetzt werden</li></ul>
<p>Deshalb liefern wir diese Gruppe als Paket und nicht als Einzelartikel. Der Grund dahinter: <a href="was-fehlt-haelt-die-baustelle-auf">Was fehlt, hält die Baustelle auf</a>.</p>
<h2>Systemtreue — warum man nicht mischen sollte</h2>
<p>Ein WDVS wird als Kombination geprüft, nicht Bestandteil für Bestandteil. Wer den Klebemörtel des einen Herstellers mit dem Gewebe eines anderen kombiniert, verlässt die geprüfte Zusammenstellung. Welche Zusammenstellung geprüft ist, steht in den Systemunterlagen des Herstellers — wir geben sie hier nicht wieder, weil sie sich je System und Ausgabe unterscheidet. Ob das technisch funktioniert, ist eine Frage; ob es im Schadensfall trägt, eine andere — und die zweite entscheidet der Sachverständige, nicht der Verarbeiter.</p>
<p>Wir führen deshalb die Komponenten eines Systems zusammen und nicht das jeweils billigste Einzelteil.</p>
<h2>Kennwerte und Datenblätter</h2>
<p>Verbrauchswerte, Schichtdicken, Standzeiten und zulässige Verarbeitungstemperaturen stehen im technischen Merkblatt des Herstellers. Wir geben sie auf den Artikelseiten wieder und verlinken das Merkblatt — abgeschrieben wird nichts, und geraten wird gar nichts.</p>
<ul><li>Capatect (Synthesa): <a href="https://www.synthesa.at/" target="_blank" rel="noopener noreferrer">synthesa.at</a></li><li>Baumit Österreich: <a href="https://www.baumit.at/" target="_blank" rel="noopener noreferrer">baumit.at</a></li></ul>
<h2>Was diese Seite nicht ist</h2>
<p>Keine Verarbeitungsanleitung und keine Bemessung. Die verbindlichen Angaben stehen in der Verarbeitungsrichtlinie des Systemherstellers und in der Planung. Diese Seite ordnet ein, damit Sie wissen, was Sie bestellen müssen.</p>

<p class="krume"><a href="#index">Start</a> › Wissen</p>
<h1>XPS oder EPS — welche Platte wohin</h1>
<p><strong>Die Antwort in zwei Sätzen.</strong> EPS kommt an die Fassade oberhalb des Sockels, XPS überall dorthin, wo Wasser und Druck dazukommen: erdberührt, unter der Bodenplatte, im Sockel- und Spritzwasserbereich. Ein Vertauschen fällt nicht sofort auf, sondern erst nach dem ersten nassen Winter.</p>
<h2>Der Unterschied in einem Satz</h2>
<p>Beide sind Polystyrol, aber unterschiedlich hergestellt: <strong>EPS</strong> ist expandiert — aufgeschäumte, verschweißte Perlen mit offenen Zwischenräumen. <strong>XPS</strong> ist extrudiert — eine geschlossenzellige Platte ohne durchgehende Hohlräume.</p>
<p>Daraus folgt alles Weitere:</p>
<div class="scroll"><table><thead><tr><th></th><th>EPS</th><th>XPS</th></tr></thead><tbody><tr><td>Wasseraufnahme</td><td>höher</td><td>sehr gering</td></tr><tr><td>Druckbelastbarkeit</td><td>geringer</td><td>höher</td></tr><tr><td>Erdberührt einsetzbar</td><td>nein</td><td>ja</td></tr><tr><td>Typischer Ort</td><td>Fassade über Sockel</td><td>Sockel, Perimeter, unter Platte</td></tr><tr><td>Preis je Fläche</td><td>günstiger</td><td>teurer</td></tr></tbody></table></div>
<p>Die genauen Kennwerte — Wärmeleitfähigkeit, Druckspannung, Wasseraufnahme — stehen im Datenblatt der jeweiligen Platte und unterscheiden sich je Typ und Dicke. Sie gehören dort nachgesehen und nicht aus einer Tabelle wie dieser übernommen.</p>
<h2>Wo die Grenze verläuft</h2>
<p>Die kritische Zone ist der <strong>Sockel</strong>: der Bereich vom Gelände bis etwa Spritzwasserhöhe. Hier trifft Fassadendämmung auf Perimeterdämmung, und hier entsteht der häufigste Fehler — EPS bis zum Boden durchgezogen, weil es billiger war und die Platte gerade dalag.</p>
<p>Was dann passiert, ist kein Einsturz, sondern etwas Unauffälligeres: Die Platte nimmt Feuchte auf, die Dämmwirkung fällt, der Putz bekommt Feuchtestellen, und im Frost arbeitet die Fläche. Sichtbar wird das in der zweiten oder dritten Heizperiode — dann, wenn niemand mehr an die Plattenwahl denkt.</p>
<h2>Die Stärken, die wir führen</h2>
<p>XPS in mehreren Stärken, EPS als Fassadenplatte in dünneren Stärken. Welche Stärke die richtige ist, ergibt sich aus dem Wärmeschutznachweis des Bauvorhabens — nicht aus dem Preis und nicht aus dem, was vorrätig ist.</p>
<p><strong>Ein praktischer Hinweis zur Bestellung:</strong> Dämmplatten werden nach Fläche verkauft, aber in Paketen geliefert. Die Paketgröße hängt an der Stärke — dünne Platten kommen in mehr Quadratmetern je Paket als dicke. Bestellen Sie in Paketeinheiten, sonst bleibt ein Rest übrig, der niemandem nützt.</p>
<h2>Was diese Seite nicht ist</h2>
<p>Keine Bemessung. Welche Dämmstärke und welche Druckfestigkeit ein konkretes Bauteil braucht, ergibt sich aus der Planung und dem Wärmeschutznachweis. Wir liefern die Platte, die dort steht.</p>

<h1>Dämmplatten</h1>
<p><strong>Die Antwort in zwei Sätzen.</strong> Wir führen XPS in mehreren Stärken für den erdberührten und den Sockelbereich, EPS als Fassadenplatte sowie Trittschall- und Trennlagen. Die Auswahl folgt dem Einbauort und dem Wärmeschutznachweis — nicht dem Preis je Quadratmeter.</p>
<h2>Die Entscheidung in einem Satz</h2>
<p>EPS oberhalb des Sockels, XPS überall dort, wo Wasser und Druck dazukommen. Ausführlich mit den Gründen: <a href="../wissen/xps-oder-eps">XPS oder EPS — welche Platte wohin</a>.</p>

<p><strong>Verschnitt.</strong> Der Zuschlag hängt an der Geometrie: glatte Wand wenig, Fassade mit vielen Öffnungen deutlich mehr. Eine pauschale Prozentzahl gibt es dafür nicht.</p>
<p><strong>Lagerung.</strong> Trocken, eben und vor Sonne geschützt — Polystyrol versprödet unter UV-Strahlung an der Oberfläche. Siehe <a href="../wissen/lagerung-von-sackware">Lagerung von Sackware und Platten</a>.</p>

<h1>Kaminsystem</h1>
<p><strong>Die Antwort in zwei Sätzen.</strong> Wir führen Systemteile für einzügige Schiedel-Kamine: Fertigfuß, Mantelsteine, gedämmte Innenrohre, Anschluss- und Putztürformteile, Zuluft, Trennstein und Regenhaube. Teile eines Systems werden nicht mit denen eines anderen gemischt: Geprüft wird die Kombination, nicht das Einzelteil — welche Kombination das ist, steht in den Systemunterlagen des jeweiligen Kamins.</p>
<h2>Was zu einem Zug gehört</h2>
<p>Der vollständige Aufbau von unten nach oben steht auf <a href="../wissen/kaminzug-aufbau">Welche Teile ein Kaminzug braucht</a>; die Bestellliste auf <a href="../system/kaminzug">Kaminzug</a>.</p>
<h2>Die drei Angaben, die Sie brauchen</h2>
<p>Gesamthöhe, Anschlusshöhe der Feuerstätte, raumluftabhängig oder -unabhängig. Ohne diese drei ist jede Stückliste geraten.</p>
<h2>Warum Vollständigkeit hier besonders zählt</h2>
<p>Ein Kamin, dem ein Formteil fehlt, ist nicht zu drei Vierteln fertig — er steht. Und weil der Zug lagenweise hochgemauert wird, fällt das fehlende Teil oft erst auf, wenn die Partie schon oben ist.</p>
<p>Herstellerunterlagen: <a href="https://www.schiedel.at/" target="_blank" rel="noopener noreferrer">schiedel.at</a>.</p>
<h2>Was hier nicht steht</h2>
<p>Querschnittsbemessung und Abnahme. Der Querschnitt gehört zum Nachweis der Feuerstätte; die Abnahme macht der Rauchfangkehrer gegen die Systemunterlagen. Was die Bauordnung des Landes verlangt, steht im Rechtsinformationssystem: <a href="https://www.ris.bka.gv.at/" target="_blank" rel="noopener noreferrer">ris.bka.gv.at</a>.</p>

<h1>Mauerwerk</h1>
<p><strong>Die Antwort in zwei Sätzen.</strong> Wir führen Planziegel für den Hochbau, palettenweise geliefert und mit Kran entladen. Steinformat und Wandstärke kommen aus der Planung; der zugehörige Mörtel gehört zum selben System wie der Stein.</p>
<h2>Was bei der Bestellung zählt</h2>
<p><strong>Steine je Quadratmeter.</strong> Ergibt sich aus dem Steinformat und ist auf dem Datenblatt des Steins angegeben. Daraus mal der Wandfläche kommt die Stückzahl, aufgerundet auf volle Paletten.</p>
<p><strong>Kranentladung.</strong> Eine Palette Ziegel wird nicht von Hand abgeladen. Der Kranhub ist eine eigene Position und fällt je Hub an — was das für die Lieferkosten heißt, steht auf <a href="../wissen/warum-keine-gratislieferung">Warum es keine Gratislieferung gibt</a>.</p>
<p><strong>Standfläche auf der Baustelle.</strong> Paletten brauchen tragfähigen, einigermaßen ebenen Untergrund. Eine gekippte Ziegelpalette ist ein Arbeitsunfall, kein Materialschaden.</p>
<h2>Was hier nicht steht</h2>
<p>Statik und Wandaufbau. Welcher Stein in welcher Stärke zulässig ist, gehört zur Planung. Wir liefern das Format, das dort steht.</p>

<h1>Mörtel und Putze</h1>
<p><strong>Die Antwort in zwei Sätzen.</strong> Wir führen Thermo- und Mauermörtel, Klebespachtel und Vergussmörtel, überwiegend von Baumit. Bei Sackware entscheidet neben dem Produkt die Lagerung: Bodenfeuchte macht zementgebundene Ware unbrauchbar, lange bevor man es sieht.</p>
<h2>Ausgewählt wird nach der Aufgabe</h2>
<p>Mauern, Kleben, Armieren, Vergießen — das sind vier verschiedene Aufgaben mit vier verschiedenen Produkten. Welches Produkt wofür freigegeben ist, steht im Merkblatt: <a href="https://www.baumit.at/" target="_blank" rel="noopener noreferrer">baumit.at</a>.</p>
<p>Beim Mauerwerk kommt dazu: Ein Systemstein braucht den Mörtel seines Systems, und beim Kaminschacht ist es der Dünnbettmörtel des Kaminsystems — nicht der Mauermörtel, der gerade dasteht.</p>
<h2>Zwei Dinge, die den Sack unbrauchbar machen</h2>
<p><strong>Bodenfeuchte.</strong> Säcke gehören auf der Palette zu bleiben. Wer sie auf den Estrich stapelt, gibt ihnen Feuchte mit.</p>
<p><strong>Zeit.</strong> Sackware hat eine begrenzte Lagerfähigkeit, aufgedruckt auf dem Sack, und die läuft ab Herstellung — nicht ab Lieferung. Ältere Ware zuerst.</p>
<p>Ausführlich: <a href="../wissen/lagerung-von-sackware">Lagerung von Sackware und Platten</a>.</p>
<h2>Das Wetterfenster</h2>
<p>Mineralische Mörtel brauchen Temperatur zum Abbinden, und zwar auch in der Nacht nach der Verarbeitung. Was zu beachten ist, steht auf <a href="../wissen/verarbeitung-bei-kaelte-und-naesse">Verarbeitung bei Kälte und Nässe</a>.</p>
<h2>Bestellhinweis</h2>
<p>Mörtel wird palettenweise geliefert. Eine angebrochene Palette ist kein Vorteil: Der Rest steht über den Winter und ist im Frühjahr oft nicht mehr brauchbar. Lieber knapper bestellen und nachbestellen — sofern die Anfahrt ohnehin ansteht.</p>

<h1>WDVS-Komponenten</h1>
<p><strong>Die Antwort in zwei Sätzen.</strong> Wir führen Klebe- und Spachtelmassen, Glasgewebe, Dübel, Kantenschutz, Putzgrund und Oberputz — die Bestandteile eines Fassadensystems. Ausgewählt wird nach dem System, nicht nach dem Einzelpreis: Geprüft wird die <strong>Kombination</strong>, nicht der einzelne Sack — welche Kombination das ist, steht in den Systemunterlagen des Herstellers.</p>
<h2>Was Sie hier finden</h2>
<p>Die Komponenten stammen überwiegend aus dem Capatect-Programm von Synthesa, ergänzt um Baumit-Produkte. Beides sind österreichische Systemanbieter mit vollständigen technischen Unterlagen: <a href="https://www.synthesa.at/" target="_blank" rel="noopener noreferrer">synthesa.at</a>, <a href="https://www.baumit.at/" target="_blank" rel="noopener noreferrer">baumit.at</a>.</p>
<h2>Wonach Sie auswählen</h2>
<p><strong>Zuerst das System, dann die Position.</strong> Wenn das Bauvorhaben ein bestimmtes System vorschreibt — aus dem Wärmeschutznachweis oder der Ausschreibung —, dann ist die Auswahl damit getroffen. Mischen verlässt die geprüfte Kombination.</p>
<p><strong>Dann die Auftragsart.</strong> Ob eine Klebe- und Spachtelmasse fein oder mittel gewählt wird, hängt an der Aufgabe: Kleben, Armieren oder beides. Die Merkblätter sagen, welches Produkt wofür freigegeben ist.</p>
<p><strong>Zuletzt die Menge.</strong> Der Rechenweg steht auf <a href="../wissen/mengen-fuer-100-qm-wdvs">Mengen für 100 m² Fassade ermitteln</a>.</p>
<h2>Das Zubehör, das die Baustelle aufhält</h2>
<p>Kantenschutzprofile, Gewebeanschlussleisten und Rondellen sind die Positionen, die in Materiallisten fehlen und auf der Baustelle gebraucht werden. Sie stehen deshalb auf unserer Systemliste <a href="../system/fassade-100-qm">Fassade 100 m²</a>, auch wenn sie klein sind.</p>
<h2>Was hier nicht steht</h2>
<p>Verarbeitungsanweisungen. Die verbindlichen Angaben stehen in der Verarbeitungsrichtlinie des Systemherstellers, und dorthin verlinken wir. Wir geben die Kennwerte wieder — wir schreiben die Richtlinie nicht ab.</p>

<p class="krume"><a href="#index">Start</a> › Sortiment</p>
<h1>Zubehör und Kleinteile</h1>
<p><strong>Die Antwort in zwei Sätzen.</strong> Wir führen Schäume, Klebebänder, Schrauben und Dübel, weil sie zur Lieferung gehören und eine zweite Anfahrt teurer ist als jede Preisdifferenz. Bei diesen Artikeln liegt unser Einkauf nah am Listenpreis — wir sagen das dazu, statt einen Vorteil zu behaupten, den es nicht gibt.</p>
<h2>Die Kennzeichnung „Beipack&quot;</h2>
<p>Einige Artikel dieser Gruppe tragen den Hinweis <strong>Beipack</strong>. Er bedeutet: Dieser Artikel ist bestellbar, aber er ist kein Grund, hier zu bestellen. Wenn Sie nur ihn brauchen, kaufen Sie ihn günstiger im Fachhandel um die Ecke.</p>
<p>Warum das so ist, steht offen auf <a href="../wissen/baumeisterpreis">Was „Baumeisterpreis&quot; heißt</a>: Der Rabatt eines Baumeisterbetriebs ist bei Systemware und Paletten tief und bei Kleinteilen dünn. Das ist die Struktur des Baustoffhandels, nicht unsere Entscheidung.</p>
<h2>Warum wir sie trotzdem führen</h2>
<p>Weil die Positionen, die eine Baustelle aufhalten, fast immer die kleinen sind. Ein fehlendes Klebeband kostet eine Fahrt; eine Fahrt kostet mehr als ein Karton Klebeband. Der Gedanke dahinter steht auf <a href="../wissen/was-fehlt-haelt-die-baustelle-auf">Was fehlt, hält die Baustelle auf</a>.</p>
<h2>Was das für Sie heißt</h2>
<p>Legen Sie das Zubehör zur Hauptbestellung dazu, nicht separat. Als Einzelbestellung lohnt sich diese Gruppe für keine der beiden Seiten.</p>

  <a class="logo" href="#index">Freudenthaler Bau GmbH</a>
  <nav><a href="#gruppe/wdvs">WDVS</a><a href="#gruppe/daemmung">Dämmung</a><a href="#gruppe/kamin">Kamin</a><a href="#gruppe/kanal">Kanal</a><a href="#wissen/index">Wissen</a><a href="#lieferung">Lieferung</a><a href="#rechtliches/index">Rechtliches</a></nav>
</header>
<p class="krume"><a href="#index">Start</a> › Systemlisten</p>
<h1>Fassade dämmen — die Liste für 100 m²</h1>
<p><strong>Die Antwort in zwei Sätzen.</strong> Sieben Positionen bilden das vollständige System: Klebemörtel, Dämmplatten, Dübel, Armierungsmörtel, Glasgewebe, Kantenschutz und Putzgrund mit Oberputz. Die Mengen ergeben sich aus den Verbrauchswerten der gewählten Produkte — der Rechenweg steht dabei, das Ergebnis rechnen Sie mit Ihren Werten.</p>
<h2>Die vollständige Positionsliste</h2>
<div class="scroll"><table><thead><tr><th>#</th><th>Position</th><th>Menge nach</th><th>wird oft vergessen</th></tr></thead><tbody><tr><td>1</td><td>Klebemörtel</td><td>Fläche × Verbrauch je Auftragsart</td><td>—</td></tr><tr><td>2</td><td>Dämmplatten</td><td>Fläche + Verschnitt, in Paketeinheiten</td><td>—</td></tr><tr><td>3</td><td>Dübel</td><td>Anzahl je m² aus der Bemessung</td><td>—</td></tr><tr><td>4</td><td>Rondellen</td><td>wie Dübel, bei versenkter Setzung</td><td><strong>ja</strong></td></tr><tr><td>5</td><td>Armierungsmörtel</td><td>Fläche × Verbrauch</td><td>—</td></tr><tr><td>6</td><td>Glasgewebe</td><td>Fläche <strong>+ Überlappung</strong></td><td><strong>ja</strong></td></tr><tr><td>7</td><td>Kantenschutz mit Gewebe</td><td>laufende Meter aller Außenecken und Laibungen</td><td><strong>ja</strong></td></tr><tr><td>8</td><td>Gewebeanschlussleisten</td><td>laufende Meter aller Fenster- und Türanschlüsse</td><td><strong>ja</strong></td></tr><tr><td>9</td><td>Putzgrund</td><td>Fläche × Verbrauch</td><td>—</td></tr><tr><td>10</td><td>Oberputz</td><td>Fläche × Verbrauch, körnungsabhängig</td><td>—</td></tr></tbody></table></div>
<p>Vier von zehn Positionen sind die, die typischerweise fehlen — und alle vier sind kleine Positionen. Warum das die teuersten sind, steht auf <a href="../wissen/was-fehlt-haelt-die-baustelle-auf">Was fehlt, hält die Baustelle auf</a>.</p>
<h2>Was Sie uns schicken müssen</h2>
<p>Vier Angaben genügen für eine vollständige Positionsliste:</p>
<ol><li><strong>Fassadenfläche</strong> brutto, und ob Laibungen enthalten sind</li><li><strong>Anzahl der Fenster und Türen</strong> — daraus kommen die laufenden Meter Anschlussleiste</li><li><strong>Anzahl der Außenecken</strong> und die Geschosshöhe</li><li><strong>Gewähltes System und Dämmstärke</strong> aus dem Wärmeschutznachweis</li></ol>
<p>Was wir <strong>nicht</strong> übernehmen: die Dübelbemessung. Sie hängt an Untergrund, Gebäudehöhe und Windlast und gehört zur Planung.</p>
<h2>Der Rechenweg</h2>
<p>Er steht ausführlich auf <a href="../wissen/mengen-fuer-100-qm-wdvs">Mengen für 100 m² Fassade ermitteln</a>. Kurzfassung: Fläche und laufende Meter aus dem Plan, Auftragsart festlegen, Verbrauchswerte aus den Merkblättern der <strong>konkret gewählten</strong> Produkte, Zuschläge für Verschnitt und Überlappung, auf Gebindegrößen aufrunden.</p>
<h2>Was vor der Bestellung geklärt sein muss</h2>
<ul><li><strong>Untergrund geprüft?</strong> Vier Handproben, zehn Minuten: <a href="../wissen/untergrund-pruefen">Untergrund prüfen</a>. Vom Befund hängen Grundierung und Klebemenge ab.</li><li><strong>Sockelbereich geklärt?</strong> Dort kommt XPS statt EPS, und das ist eine eigene Position: <a href="../wissen/xps-oder-eps">XPS oder EPS</a>.</li><li><strong>Wetterfenster?</strong> Mineralische Putze brauchen Temperatur: <a href="../wissen/verarbeitung-bei-kaelte-und-naesse">Verarbeitung bei Kälte und Nässe</a>.</li><li><strong>Lagerplatz?</strong> Sackware trocken und auf der Palette: <a href="../wissen/lagerung-von-sackware">Lagerung</a>.</li></ul>
<h2>Warum als Paket und nicht als Einzelartikel</h2>
<p>Weil eine zweite Anfahrt für ein vergessenes Kantenschutzprofil mehr kostet als das Profil. Die Positionsliste ist kein Zwangspaket — Sie streichen, was Sie schon haben. Aber sie steht vollständig da, bevor Sie streichen.</p>

<p class="krume"><a href="#index">Start</a> › Systemlisten</p>
<h1>Kaminzug — die Liste für einen Zug</h1>
<p><strong>Die Antwort in zwei Sätzen.</strong> Ein einzügiger Systemkamin braucht Fertigfuß, Mantelsteine, Innenrohre mit Dämmung, Anschlussformteile, Putztüranschluss, Zuluftführung und den Kopf über Dach — dazu Dünnbettmörtel und Fugenmasse. Drei Angaben entscheiden über die Stückliste: Gesamthöhe, Anschlusshöhe der Feuerstätte und ob raumluftunabhängig gefeuert wird.</p>
<h2>Die Positionsliste, von unten nach oben</h2>
<div class="scroll"><table><thead><tr><th>#</th><th>Position</th><th>Menge nach</th><th>wird oft vergessen</th></tr></thead><tbody><tr><td>1</td><td>Fertigfußpaket</td><td>1 je Zug</td><td>—</td></tr><tr><td>2</td><td>Mantelsteine</td><td>Gesamthöhe ÷ Steinhöhe</td><td>—</td></tr><tr><td>3</td><td>Dünnbettmörtel</td><td>Anzahl Lagen</td><td><strong>ja</strong></td></tr><tr><td>4</td><td>Innenrohr gedämmt</td><td>Gesamthöhe ÷ Rohrlänge</td><td>—</td></tr><tr><td>5</td><td>Fugenmasse</td><td>Anzahl Rohrstöße</td><td><strong>ja</strong></td></tr><tr><td>6</td><td>Anschlussformteil Feuerstätte</td><td>1 je Anschluss</td><td>—</td></tr><tr><td>7</td><td>Putztüranschluss</td><td>1 je Zug</td><td><strong>ja</strong></td></tr><tr><td>8</td><td>Zuluftplatte mit Befestigung</td><td>nur raumluftunabhängig</td><td><strong>ja</strong></td></tr><tr><td>9</td><td>Thermo-Trennstein</td><td>1 je Zug, am Kopf</td><td><strong>ja</strong></td></tr><tr><td>10</td><td>Regenhaube mit Sicherung</td><td>1 je Zug</td><td>—</td></tr></tbody></table></div>
<p>Fünf von zehn Positionen sind die typischen Vergessenen — und ein Kamin, dem der Putztüranschluss fehlt, ist nicht halb fertig, sondern steht.</p>
<h2>Die drei Angaben, die alles bestimmen</h2>
<p><strong>Gesamthöhe des Zugs.</strong> Von der Fußplatte bis zur Mündung über Dach. Daraus ergeben sich Mantelsteine und Rohre — und weil beide unterschiedliche Bauhöhen haben, sind es zwei getrennte Rechnungen, nicht eine.</p>
<p><strong>Anschlusshöhe der Feuerstätte.</strong> Die Höhe, in der das Anschlussformteil sitzt. Sie wird vor dem Aufmauern festgelegt; nachträglich ist sie nicht änderbar.</p>
<p><strong>Raumluftabhängig oder -unabhängig.</strong> Davon hängt ab, ob die Zuluftführung und ihre Formteile dazukommen.</p>
<h2>Was wir nicht übernehmen</h2>
<p><strong>Die Dimensionierung des Querschnitts.</strong> Sie gehört zum Nachweis der Feuerstätte und kommt vom Planer oder Ofensetzer. Wir liefern den Querschnitt, der dort steht.</p>
<p><strong>Die Abnahme.</strong> Der Rauchfangkehrer prüft gegen die Systemunterlagen. Deshalb liefern wir Teile eines Systems zusammen und mischen sie nicht — der Grund steht auf <a href="../wissen/kaminzug-aufbau">Welche Teile ein Kaminzug braucht</a>.</p>
<h2>Bevor Sie bestellen</h2>
<p>Halten Sie die drei Angaben bereit und die Systembezeichnung. Ohne sie ist jede Stückliste geraten, und eine geratene Kaminstückliste ist die teuerste Art, Material zu bestellen.</p>

<h1>Grundleitung DN 100 — die Liste</h1>
<p><strong>Die Antwort in zwei Sätzen.</strong> Rohre nach laufenden Metern, Bögen und Abzweiger nach Winkel, Schächte nach Tiefe, dazu Übergänge und Gleitmittel. Fünf Zahlen aus dem Plan ergeben die vollständige Bestellung, und sie sind in zehn Minuten ausgezählt.</p>
<h2>Die fünf Zahlen aus dem Plan</h2>
<ol><li><strong>Laufende Meter je Nennweite</strong> — die Leitungslängen, addiert</li><li><strong>Bögen je Winkel</strong> — jeden Richtungswechsel zählen, den Winkel ablesen</li><li><strong>Abzweiger je Winkel</strong> — jede Einbindung einer Zuleitung</li><li><strong>Schächte</strong> — Anzahl und Tiefe, daraus die Schachtringe</li><li><strong>Übergänge</strong> — jede Stelle, an der Nennweite oder Rohrart wechselt</li></ol>
<p>Mehr braucht es nicht. Was regelmäßig danebengeht, ist Punkt 2 und Punkt 5: Bögen werden gezählt, aber der Winkel nicht abgelesen, und Übergänge stehen im Plan als Symbol statt als Position.</p>
<h2>Die Positionsliste</h2>
<div class="scroll"><table><thead><tr><th>#</th><th>Position</th><th>Menge nach</th><th>wird oft vergessen</th></tr></thead><tbody><tr><td>1</td><td>Kanalrohr</td><td>laufende Meter, aufgerundet auf Stangen</td><td>—</td></tr><tr><td>2</td><td>Bögen</td><td>Anzahl je Winkel</td><td>Winkel falsch</td></tr><tr><td>3</td><td>Abzweiger</td><td>Anzahl je Winkel</td><td>—</td></tr><tr><td>4</td><td>Schachtringe</td><td>Tiefe ÷ Ringhöhe</td><td>—</td></tr><tr><td>5</td><td>Übergangsstücke</td><td>Anzahl Materialwechsel</td><td><strong>ja</strong></td></tr><tr><td>6</td><td>Gleitmittel</td><td>nach Anzahl der Steckverbindungen</td><td><strong>ja</strong></td></tr><tr><td>7</td><td>Grundmauerschutzbahn</td><td>Fläche + Überlappung</td><td>eigenes Gewerk</td></tr><tr><td>8</td><td>Abschlussschiene</td><td>laufende Meter Oberkante</td><td><strong>ja</strong></td></tr></tbody></table></div>
<p>Positionen 7 und 8 gehören streng genommen zum Bauwerk, nicht zur Leitung — sie werden aber im selben Arbeitsgang verbaut und deshalb hier mitgeführt. Siehe <a href="../wissen/perimeterdaemmung-und-grundmauerschutz">Perimeterdämmung und Grundmauerschutz</a>.</p>
<h2>Was aus der Planung kommt</h2>
<p><strong>Nennweite, Gefälle und Materialart.</strong> Sie ergeben sich aus der Entwässerungsplanung und den Vorgaben des Kanalbetreibers, nicht aus dem Sortiment. Eine nachträglich geänderte Nennweite macht die halbe Bestellung wertlos — deshalb: Plan zuerst, Bestellung danach.</p>
<h2>Warum das Gleitmittel auf der Liste steht</h2>
<p>Weil Steckmuffen Dichtringe haben und die ohne Gleitmittel beim Stecken verdrückt werden. Der Fehler zeigt sich erst bei der Dichtheitsprüfung — also dann, wenn die Leitung schon liegt. Eine Position, die fast nichts kostet und deren Fehlen einen ganzen Abschnitt kostet.</p>
