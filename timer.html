<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stoppuhr – 30 Minuten</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="timer">
    <h1 class="timer-heading">Stoppuhr</h1>
    <div id="timer-display" class="timer-display" aria-live="polite">30:00</div>

    <div class="timer-controls">
      <button id="start-button" class="timer-button timer-button-primary" type="button">Start</button>
      <button id="pause-button" class="timer-button" type="button" disabled>Pause</button>
      <button id="reset-button" class="timer-button" type="button">Zurücksetzen</button>
    </div>
  </main>

  <script src="timer.js"></script>
</body>
</html>
