const CC=13, SS=74/9;
function rect(i){
 if(i===0)return{x:100-CC,y:100-CC,w:CC,h:CC};
 if(i<10)return{x:100-CC-i*SS,y:100-CC,w:SS,h:CC};
 if(i===10)return{x:0,y:100-CC,w:CC,h:CC};
 if(i<20)return{x:0,y:100-CC-(i-10)*SS,w:CC,h:SS};
 if(i===20)return{x:0,y:0,w:CC,h:CC};
 if(i<30)return{x:CC+(i-21)*SS,y:0,w:SS,h:CC};
 if(i===30)return{x:100-CC,y:0,w:CC,h:CC};
 return{x:100-CC,y:CC+(i-31)*SS,w:CC,h:SS};
}

function renderTokens(){
 const b=$('#board');
 S.players.forEach((p,k)=>{if(!tokEls[k]){const t=document.createElement('div');t.className='tok';b.appendChild(t);tokEls[k]=t}
  const t=tokEls[k];t.style.background=p.color;t.textContent=p.name.replace(/^KI\s+/,'')[0].toUpperCase();t.hidden=p.bankrupt;t.classList.toggle('now',k===S.cur&&!S.over)});
 tokEls.slice(S.players.length).forEach(t=>t.remove());tokEls.length=S.players.length;
 const groups={};
 S.players.forEach((p,k)=>{if(p.bankrupt)return;const key=p.pos+(p.jail?'j':'');(groups[key]=groups[key]||[]).push(k)});
 for(const key in groups){
  const ks=groups[key],pos=parseInt(key),r=rect(pos),jail=key.endsWith('j');
  let cx=r.x+r.w/2,cy=r.y+r.h/2;
  if(pos===10){if(jail){cx=r.x+r.w*.65;cy=r.y+r.h*.35}else{cx=r.x+r.w*.15;cy=r.y+r.h*.4}}
  ks.forEach((k,j)=>{const n=ks.length,cols=pos===10&&!jail?1:Math.min(n,2),row=Math.floor(j/cols),col=j%cols,rows=Math.ceil(n/cols);
   const dx=(col-(cols-1)/2)*3.2,dy=(row-(rows-1)/2)*3.2;
   tokEls[k].style.left=(cx+dx)+'%';tokEls[k].style.top=(cy+dy)+'%'});
 }
}

/* ===== Geld ===== */
function gain(p,v){p.money+=v}
function pay(p,v,to){p.money-=v;if(to!=null&&to>=0)S.players[to].money+=v;if(p.money<0)p.creditor=to;render()}
function rent(i,dice){
 const s=SP[i],pr=S.props[i];if(pr.mort)return 0;
 if(s.t==='prop')return pr.houses?s.rent[pr.houses]:(ownsZone(pr.owner,s.z)?s.rent[0]*2:s.rent[0]);
 const n=owned(pr.owner).filter(j=>SP[j].t===s.t).length;
 if(s.t==='port')return 25*2**(n-1);
 return dice*(n>=2?10:4);
}

/* ===== Bauen & Hypothek ===== */
function whyNoBuild(k,i){
 const s=SP[i],pr=S.props[i],p=S.players[k];
 if(s.t!=='prop')return 'Hier kann man nicht bauen.';
 if(!ownsZone(k,s.z))return 'Dafür brauchst du die ganze Zone.';
 const zs=zoneProps(s.z);
 if(zs.some(j=>S.props[j].mort))return 'In der Zone liegt eine Hypothek.';
 if(pr.houses>=5)return 'Zentrale steht schon.';
 if(pr.houses>Math.min(...zs.map(j=>S.props[j].houses)))return 'Gleichmäßig bauen: zuerst die anderen Firmen.';
 if(pr.houses===4?S.hotels<1:S.houses<1)return 'Die Bank hat keine mehr.';
 if(p.money<ZONES[s.z].h)return 'Zu wenig Kapital.';
 return '';
}
function build(k,i){const pr=S.props[i];if(pr.houses===4){S.hotels--;S.houses+=4}else S.houses--;pr.houses++;S.players[k].money-=ZONES[SP[i].z].h}
function whyNoSell(k,i){const s=SP[i],pr=S.props[i];if(s.t!=='prop'||pr.houses===0)return 'Keine Filiale vorhanden.';
 if(pr.houses<Math.max(...zoneProps(s.z).map(j=>S.props[j].houses)))return 'Gleichmäßig verkaufen: zuerst die anderen.';return ''}
function sellHouse(k,i){const pr=S.props[i],h=ZONES[SP[i].z].h/2,p=S.players[k];
 if(pr.houses===5){if(S.houses>=4){S.houses-=4;S.hotels++;pr.houses=4;p.money+=h}else{S.hotels++;pr.houses=0;p.money+=h*5}}
 else{pr.houses--;S.houses++;p.money+=h}}
function whyNoMort(k,i){const s=SP[i],pr=S.props[i];if(pr.mort)return 'Schon belastet.';
 if(s.t==='prop'&&zoneProps(s.z).some(j=>S.props[j].houses>0))return 'Zuerst alle Filialen der Zone verkaufen.';return ''}
function mortgage(k,i){S.props[i].mort=true;S.players[k].money+=mortVal(i)}
function unmortgage(k,i){S.props[i].mort=false;S.players[k].money-=unmortCost(i)}

/* ===== Verwalten (Mensch) ===== */
function openManage(p){
 return new Promise(res=>{
  const k=idx(p);
  const draw=()=>{
   const list=owned(k).sort((a,b)=>a-b);
   const rows=list.map(i=>{const s=SP[i],pr=S.props[i],c=s.t==='prop'?ZONES[s.z].c:s.t==='port'?'#222':'#ddd';
    const hs=s.t!=='prop'?'':pr.houses===5?'Zentrale':pr.houses?`${pr.houses} Filiale${pr.houses>1?'n':''}`:'keine Filiale';
    const nb=whyNoBuild(k,i),ns=whyNoSell(k,i),nm=whyNoMort(k,i);
    const um=pr.mort?(p.money>=unmortCost(i)?'':'Zu wenig Kapital.'):nm;
    return `<div class="mgrow"><span class="sw" style="background:${c}"></span><div class="nmx"><b>${esc(s.n)}</b><small>${hs}${pr.mort?' · Hypothek':''} · Miete jetzt ${s.t==='util'?'Würfel ×'+(owned(k).filter(j=>SP[j].t==='util').length>1?10:4):rent(i,7)}</small></div>
     <div class="row" style="margin:0;gap:6px">${s.t==='prop'?`<button class="mini" data-a="b" data-i="${i}" ${nb?`disabled title="${esc(nb)}"`:''}>+ Filiale ${ZONES[s.z].h}</button><button class="mini" data-a="s" data-i="${i}" ${ns?`disabled title="${esc(ns)}"`:''}>− Verkauf</button>`:''}
     <button class="mini" data-a="${pr.mort?'u':'m'}" data-i="${i}" ${um?`disabled title="${esc(um)}"`:''}>${pr.mort?`Einlösen ${unmortCost(i)}`:`Hypothek +${mortVal(i)}`}</button></div></div>`}).join('');
   const box=openModal(`<h3>Firmen von ${esc(p.name)}</h3><p><b>Kapital: ${fmt(p.money)}</b>${p.money<0?' · <b style="color:#c62128">Schulden begleichen!</b>':''}</p>
    <p class="note">Filialen baust du nur mit einer kompletten Zone und gleichmäßig. Die 5. Stufe ist die Konzernzentrale. Verkauf und Hypothek bringen die Hälfte.</p>
    ${rows||'<p>Noch keine Firmen gekauft.</p>'}<div class="row"><button class="btn main" id="x">Fertig</button></div>`);
   box.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,a=b.dataset.a;
    if(a==='b'){build(k,i);log(`${p.name} baut eine ${S.props[i].houses===5?'Konzernzentrale':'Filiale'} bei ${SP[i].n}.`)}
    if(a==='s'){sellHouse(k,i);log(`${p.name} verkauft bei ${SP[i].n}.`)}
    if(a==='m'){mortgage(k,i);log(`${p.name} nimmt eine Hypothek auf ${SP[i].n}.`)}
    if(a==='u'){unmortgage(k,i);log(`${p.name} löst ${SP[i].n} ein.`)}
    render();draw()});
   box.querySelector('#x').onclick=()=>{closeModal();render();res()};
  };
  draw();
 });
}

/* ===== Handel ===== */
const tradable=(k,i)=>S.props[i].owner===k&&(SP[i].t!=='prop'||zoneProps(SP[i].z).every(j=>S.props[j].houses===0));
function tv(k,i){const s=SP[i];let v=s.price*(S.props[i].mort?.55:1);
 if(s.t==='prop'&&zoneProps(s.z).filter(j=>j!==i).every(j=>S.props[j].owner===k))v*=2.5;
 if(s.t==='port')v*=1+.25*owned(k).filter(j=>j!==i&&SP[j].t==='port').length;return v}
function aiAccepts(q,give,get,other){// give: was q abgibt, get: was q bekommt
 const kq=idx(q);
 let g=get.money+get.cards*50,l=give.money+give.cards*50;
 get.props.forEach(i=>g+=tv(kq,i));
 give.props.forEach(i=>{l+=tv(kq,i);if(other!=null&&SP[i].t==='prop'&&zoneProps(SP[i].z).filter(j=>j!==i).every(j=>S.props[j].owner===other||get.props.includes(j)))l+=SP[i].price*1.5});
 return q.money-give.money>=0&&g>=l*1.2+10;
}
function doTrade(a,b,ga,gb){// a gibt ga an b, b gibt gb an a
 const A=S.players[a],B=S.players[b];
 ga.props.forEach(i=>S.props[i].owner=b);gb.props.forEach(i=>S.props[i].owner=a);
 A.money+=gb.money-ga.money;B.money+=ga.money-gb.money;
 for(let n=0;n<ga.cards;n++)B.free.push(A.free.pop());for(let n=0;n<gb.cards;n++)A.free.push(B.free.pop());
 log(`Handel: ${A.name} gibt ${tdesc(ga)} – ${B.name} gibt ${tdesc(gb)}.`);render();
}
function openTrade(p){
 return new Promise(res=>{
  const k=idx(p),ops=others(p);let partner=idx(ops[0]),note='';
  const side=(kk,pre)=>{const q=S.players[kk];const ps=owned(kk).filter(i=>tradable(kk,i)).sort((a,b)=>a-b);
   return `${ps.map(i=>`<label><input type="checkbox" id="${pre}${i}" data-i="${i}"> <span class="dot" style="width:12px;height:12px;border-radius:2px;border-width:1px;background:${SP[i].t==='prop'?ZONES[SP[i].z].c:SP[i].t==='port'?'#222':'#ddd'}"></span>${esc(SP[i].n)}${S.props[i].mort?' (Hyp.)':''}</label>`).join('')||'<p class="note">Keine handelbaren Firmen.</p>'}
   <label class="field" style="flex-direction:column;align-items:stretch">Geld (max. ${fmt(q.money)})<input type="number" id="${pre}money" min="0" max="${Math.max(0,q.money)}" step="10" value="0"></label>
   ${q.free.length?`<label><input type="checkbox" id="${pre}card"> Freikarte U-Haft</label>`:''}`};
  const draw=()=>{const box=openModal(`<h3>Handel</h3><label class="field">Handelspartner<select id="tp">${ops.map(q=>`<option value="${idx(q)}" ${idx(q)===partner?'selected':''}>${esc(q.name)}</option>`).join('')}</select></label>
   <p class="note" style="margin-top:8px">Firmen mit Filialen in ihrer Zone sind nicht handelbar. Hypotheken gehen mit über.</p>
   <div class="tgrid"><div><h3 style="font-size:16px">Du gibst</h3>${side(k,'a')}</div><div><h3 style="font-size:16px">Du bekommst</h3>${side(partner,'b')}</div></div>
   <p id="tnote" style="font-weight:700">${esc(note)}</p><div class="row"><button class="btn main" id="go">Angebot machen</button><button class="btn" id="x">Abbrechen</button></div>`);
   box.querySelector('#tp').onchange=e=>{partner=+e.target.value;note='';draw()};
   box.querySelector('#x').onclick=()=>{closeModal();res()};
   box.querySelector('#go').onclick=async()=>{
    const grab=(pre,kk)=>({props:[...box.querySelectorAll(`input[id^="${pre}"][data-i]:checked`)].map(c=>+c.dataset.i),money:Math.max(0,Math.min(S.players[kk].money,Math.floor(+box.querySelector('#'+pre+'money').value||0))),cards:box.querySelector('#'+pre+'card')?.checked?1:0});
    const ga=grab('a',k),gb=grab('b',partner),q=S.players[partner];
    if(!ga.props.length&&!gb.props.length&&!ga.cards&&!gb.cards){note='Wähle mindestens eine Firma oder Freikarte.';return draw()}
    if(q.ai){if(aiAccepts(q,gb,ga,k)){doTrade(k,partner,ga,gb);closeModal();res()}else{note=`${q.name} lehnt ab. Mach ein besseres Angebot.`;draw()}return}
    const b2=openModal(`<h3>${esc(q.name)}, nimmst du an?</h3><p>${esc(p.name)} bietet dir: <b>${esc(tdesc(ga))}</b></p><p>und möchte dafür: <b>${esc(tdesc(gb))}</b></p><div class="row"><button class="btn main" id="ok">Annehmen</button><button class="btn" id="no">Ablehnen</button></div>`);
    b2.querySelector('#ok').onclick=()=>{doTrade(k,partner,ga,gb);closeModal();res()};
    b2.querySelector('#no').onclick=()=>{note=`${q.name} hat abgelehnt.`;draw()};
   };
  };
  draw();
 });
}

/* ===== Computer-Gegner ===== */
function aiValue(q,i){const k=idx(q),s=SP[i];let v=tv(k,i);
 if(s.t==='prop'){const zs=zoneProps(s.z).filter(j=>j!==i);const o=S.props[zs[0]].owner;if(o>=0&&o!==k&&zs.every(j=>S.props[j].owner===o))v+=s.price*.4}
 return v}
function aiManage(p){const k=idx(p);
 owned(k).filter(i=>S.props[i].mort).sort((a,b)=>SP[b].price-SP[a].price).forEach(i=>{if(p.money-unmortCost(i)>400){unmortgage(k,i);log(`${p.name} löst ${SP[i].n} ein.`)}});
 for(let guard=0;guard<60;guard++){
  const c=owned(k).filter(i=>whyNoBuild(k,i)==='').sort((a,b)=>S.props[a].houses-S.props[b].houses||SP[b].price-SP[a].price);
  const i=c.find(i=>p.money-ZONES[SP[i].z].h>=220);if(i==null)break;
  build(k,i);log(`${p.name} baut eine ${S.props[i].houses===5?'Konzernzentrale':'Filiale'} bei ${SP[i].n}.`);
 }
 render();
}
function aiRaise(p){const k=idx(p);
 for(let guard=0;guard<80&&p.money<0;guard++){
  const m=owned(k).filter(i=>whyNoMort(k,i)==='').sort((a,b)=>tv(k,a)-tv(k,b));
  const nonZone=m.filter(i=>SP[i].t!=='prop'||!ownsZone(k,SP[i].z));
  if(nonZone.length){mortgage(k,nonZone[0]);log(`${p.name} nimmt eine Hypothek auf ${SP[nonZone[0]].n}.`);continue}
  const s=owned(k).filter(i=>whyNoSell(k,i)==='').sort((a,b)=>SP[a].price-SP[b].price);
  if(s.length){sellHouse(k,s[0]);log(`${p.name} verkauft bei ${SP[s[0]].n}.`);continue}
  if(m.length){mortgage(k,m[0]);log(`${p.name} nimmt eine Hypothek auf ${SP[m[0]].n}.`);continue}
  break;
 }
}
const tdesc=x=>[...x.props.map(i=>SP[i].n),x.money?fmt(x.money):'',x.cards?'1 Freikarte':''].filter(Boolean).join(', ')||'nichts';
async function aiTryTrade(p){
 const k=idx(p);S.cool=S.cool||{};if(S.cool[k]>0){S.cool[k]--;return}
 const need=z=>{const zs=zoneProps(z),miss=zs.filter(i=>S.props[i].owner!==k);return zs.length-miss.length>0&&miss.length===1?miss[0]:null};
 for(const z in ZONES){
  const i=need(z);if(i==null)continue;const o=S.props[i].owner;if(o<0||o===k||!tradable(o,i))continue;
  const q=S.players[o];let give={props:[],money:0,cards:0};
  // Tausch: hat q eine Zone, der nur eine Firma von p fehlt?
  for(const z2 in ZONES){const zs=zoneProps(z2),miss=zs.filter(j=>S.props[j].owner!==o);
   if(z2!==z&&miss.length===1&&zs.length>1&&S.props[miss[0]].owner===k&&tradable(k,miss[0])){give.props=[miss[0]];break}}
  if(give.props.length){const d=SP[i].price-SP[give.props[0]].price;if(d>0)give.money=Math.min(Math.max(0,p.money-100),d)}
  else give.money=Math.min(p.money-150,Math.round(SP[i].price*3.4/10)*10);
  if(give.money<0||(!give.props.length&&give.money<SP[i].price*3))continue;
  const get={props:[i],money:0,cards:0};
  if(q.ai){if(aiAccepts(q,get,give,k)){doTrade(k,o,give,get);say(`${p.name} kauft ${SP[i].n} von ${q.name}.`);await sleep(600)}else S.cool[k]=3;return}
  S.cool[k]=6;
  const c=await choose(q,[{v:1,l:'Annehmen',main:1},{v:0,l:'Ablehnen'}],'tradeoffer',{modal:`<h3>Angebot von ${esc(p.name)}</h3><p>${esc(q.name)}, ${esc(p.name)} bietet dir <b>${esc(tdesc(give))}</b> für <b>${esc(SP[i].n)}</b>.</p><p class="note">Damit hätte ${esc(p.name)} die komplette Zone ${ZONES[z].n}.</p>`});
  if(c){doTrade(k,o,give,get)}else log(`${q.name} lehnt das Angebot von ${p.name} ab.`);
  return;
 }
}
async function aiChoose(p,opts,ctx,x){
 await sleep(ctx==='auction'?260:520);
 const has=v=>opts.some(o=>o.v===v);
 if(ctx==='roll'){await aiTryTrade(p);aiManage(p);return opts[0].v}
 if(ctx==='end'){aiManage(p);return opts[0].v}
 if(ctx==='jail'){const free=Object.values(S.props).filter(r=>r.owner<0).length;
  if(free>6){if(has('card'))return 'card';if(has('pay')&&p.money>=250)return 'pay'}return 'roll'}
 if(ctx==='buy'){const s=SP[x.i];return(p.money-s.price>=90||(aiValue(p,x.i)>s.price*1.4&&p.money>=s.price))?'buy':'no'}
 if(ctx==='auction'){const max=Math.min(p.money-60,aiValue(p,x.i)*.95);const step=[...opts].filter(o=>o.v>0&&x.bid+o.v<=max).sort((a,b)=>a.v-b.v);
  if(!step.length)return 0;return (max-x.bid>200&&step.find(o=>o.v===50))?50:step[0].v}
 return opts[0].v;
}

/* ===== Spielablauf ===== */
async function rollDice(){
 const d1=$('#d1'),d2=$('#d2');d1.classList.add('roll');d2.classList.add('roll');
 for(let n=0;n<7;n++){face(d1,1+Math.random()*6|0);face(d2,1+Math.random()*6|0);await sleep(55)}
 d1.classList.remove('roll');d2.classList.remove('roll');
 const a=1+Math.random()*6|0,b=1+Math.random()*6|0;S.dice=[a,b];face(d1,a);face(d2,b);return[a,b];
}
async function step(p){p.pos=(p.pos+1)%40;if(p.pos===0){gain(p,200);log(`${p.name} zieht über START: +200 Mio.`)}renderTokens();renderPlayers();await sleep(130)}
async function moveBy(p,n){for(let s=0;s<n;s++)await step(p)}
async function moveTo(p,t){while(p.pos!==t)await step(p)}
async function backTo(p,n){for(let s=0;s<n;s++){p.pos=(p.pos+39)%40;renderTokens();await sleep(130)}}
function toJail(p){p.pos=10;p.jail=true;p.jailTurns=0;render()}

async function land(p,dice,special){
 const i=p.pos,s=SP[i],k=idx(p);
 if(BUY(s)){const pr=S.props[i];
  if(pr.owner<0)await offerBuy(p,i);
  else if(pr.owner!==k){const o=S.players[pr.owner];
   if(pr.mort)say(`${s.n} ist mit Hypothek belastet – keine Miete.`);
   else{let r;if(special==='util10'){const[a,b]=await rollDice();r=(a+b)*10}else{r=rent(i,dice);if(special==='port2')r*=2}
    pay(p,r,pr.owner);say(`${p.name} zahlt ${fmt(r)} Miete an ${o.name} (${s.n}).`)}}
  else say(`${p.name} ist bei der eigenen Firma ${s.n}.`);
 }else if(s.t==='tax'){pay(p,s.amt,null);say(`${p.name} zahlt ${fmt(s.amt)} ${s.n}.`)}
 else if(s.t==='chance'||s.t==='chest')await drawCard(p,s.t,dice);
 else if(s.t==='gojail'){say(`Kartellamt! ${p.name} muss in U-Haft.`);toJail(p)}
 else if(s.t==='park')say(`${p.name} parkt kostenlos.`);
 else if(s.t==='jail')say(`${p.name} ist nur zu Besuch in der U-Haft.`);
 render();await settle(p);
}
async function offerBuy(p,i){
 const s=SP[i];let c='no';
 if(p.money>=s.price)c=await choose(p,[{v:'buy',l:`Kaufen für ${fmt(s.price)}`,main:1},{v:'no',l:'Nicht kaufen – versteigern'}],'buy',{i,modal:`<h3>${esc(p.name)}: ${esc(s.n)} kaufen?</h3>`+deedHtml(i)+`<p class="note" style="margin-top:10px">Dein Kapital: ${fmt(p.money)}</p>`});
 else say(`${p.name} hat zu wenig Kapital für ${s.n}.`);
 if(c==='buy'){p.money-=s.price;S.props[i].owner=idx(p);say(`${p.name} kauft ${s.n} für ${fmt(s.price)}.`);render()}
 else await auction(i);
}
async function auction(i){
 const s=SP[i];let bid=0,lead=-1;const passed=new Set();
 const seats=[];for(let n=0;n<S.players.length;n++){const k=(S.cur+n)%S.players.length;if(!S.players[k].bankrupt)seats.push(k)}
 say(`Versteigerung: ${s.n} (Listenpreis ${fmt(s.price)}).`);
 for(let j=0;j<500;j++){
  const un=seats.filter(k=>!passed.has(k));if(!un.length||(un.length===1&&un[0]===lead))break;
  const k=seats[j%seats.length];if(passed.has(k)||k===lead)continue;
  const q=S.players[k];
  const opts=[10,50,100].filter(x=>bid+x<=q.money).map(x=>({v:x,l:`+${x} → ${fmt(bid+x)}`,main:x===10}));opts.push({v:0,l:'Passen'});
  const c=await choose(q,opts,'auction',{i,bid,modal:`<h3>Versteigerung – ${esc(q.name)} bietet?</h3>`+deedHtml(i)+`<p style="margin-top:10px"><b>Höchstgebot: ${bid?fmt(bid)+' von '+esc(S.players[lead].name):'noch keines'}</b> · Dein Kapital: ${fmt(q.money)}</p>`});
  if(!c){passed.add(k);log(`${q.name} passt.`)}else{bid+=c;lead=k;say(`${q.name} bietet ${fmt(bid)}.`)}
 }
 if(lead>=0){S.players[lead].money-=bid;S.props[i].owner=lead;say(`${S.players[lead].name} ersteigert ${s.n} für ${fmt(bid)}.`)}
 else say(`Niemand bietet – ${s.n} bleibt bei der Bank.`);
 render();
}
async function drawCard(p,d,dice){
 const id=S.decks[d].shift(),c=CARDS[d][id];if(c.a!=='card')S.decks[d].push(id);
 const title=d==='chance'?'Börsen-News':'Konzernkasse';
 log(`${p.name} zieht ${title}: ${c.x}`);
 if(p.ai){$('#msg').textContent=`${title}: ${c.x}`;await sleep(1500)}
 else await choose(p,[{v:1,l:'OK',main:1}],'card',{modal:`<div class="ccard ${d}"><h4>${title.toUpperCase()}</h4><p>${esc(c.x)}</p></div>`});
 const k=idx(p);
 switch(c.a){
  case 'move':await moveTo(p,c.to);await land(p,dice);break;
  case 'nearport':{let t=p.pos;do t=(t+1)%40;while(SP[t].t!=='port');await moveTo(p,t);await land(p,dice,'port2');break}
  case 'nearutil':{let t=p.pos;do t=(t+1)%40;while(SP[t].t!=='util');await moveTo(p,t);await land(p,dice,'util10');break}
  case 'gain':gain(p,c.v);break;
  case 'pay':pay(p,c.v,null);break;
  case 'card':p.free.push(d);break;
  case 'back':await backTo(p,3);await land(p,dice);break;
  case 'jail':toJail(p);break;
  case 'repair':{let h=0,H=0;owned(k).forEach(i=>{const n=S.props[i].houses;if(n===5)H++;else h+=n});pay(p,h*c.h+H*c.H,null);break}
  case 'payeach':others(p).forEach(o=>pay(p,c.v,idx(o)));break;
  case 'collecteach':for(const o of others(p)){pay(o,c.v,k);await settle(o)}break;
 }
 render();
}
async function settle(p){
 if(p.money>=0||p.bankrupt)return;
 if(p.ai){aiRaise(p);if(p.money<0)bankrupt(p);render();return}
 while(p.money<0&&!p.bankrupt){
  say(`${p.name} hat ${fmt(-p.money)} Schulden. Verkaufe Filialen, nimm Hypotheken auf oder handle.`);
  const c=await choose(p,[{v:'m',l:'Vermögen verwalten',main:1},{v:'b',l:'Bankrott erklären'}],'debt');
  if(c==='m')await openManage(p);
  else if(await choose(p,[{v:1,l:'Ja, Bankrott',main:1},{v:0,l:'Zurück'}],'confirm',{modal:`<h3>Wirklich Bankrott erklären?</h3><p>${esc(p.name)} scheidet aus. Alle Firmen gehen an ${p.creditor>=0&&p.creditor!=null?esc(S.players[p.creditor].name):'die Bank'}.</p>`}))bankrupt(p);
 }
}
function bankrupt(p){
 const k=idx(p),cr=p.creditor!=null&&p.creditor>=0&&!S.players[p.creditor].bankrupt?p.creditor:null;
 owned(k).forEach(i=>{const pr=S.props[i];if(pr.houses){const h=ZONES[SP[i].z].h/2;if(pr.houses===5){S.hotels++;p.money+=h*5}else{S.houses+=pr.houses;p.money+=h*pr.houses}pr.houses=0}});
 if(cr!=null){const c=S.players[cr];c.money+=p.money;owned(k).forEach(i=>S.props[i].owner=cr);c.free.push(...p.free)}
 else{owned(k).forEach(i=>{S.props[i].owner=-1;S.props[i].mort=false});p.free.forEach(d=>S.decks[d].push(FREE[d]))}
 p.money=0;p.free=[];p.bankrupt=true;p.jail=false;
 say(`${p.name} ist bankrott und scheidet aus.`);
 const alive=S.players.filter(q=>!q.bankrupt);
 if(alive.length===1){S.over=true;render();
  const box=openModal(`<h3>${esc(alive[0].name)} gewinnt!</h3><p>${esc(alive[0].name)} beherrscht jetzt die Weltmärkte mit ${fmt(alive[0].money)} Kapital und ${owned(idx(alive[0])).length} Firmen.</p><div class="row"><button class="btn main" id="ng">Neues Spiel</button><button class="btn" id="x">Brett ansehen</button></div>`);
  box.querySelector('#ng').onclick=showSetup;box.querySelector('#x').onclick=closeModal}
 render();
}
async function jailTurn(p){
 p.jailTurns++;
 const o=[];if(p.money>=50)o.push({v:'pay',l:'50 Mio Kaution'});if(p.free.length)o.push({v:'card',l:'Freikarte nutzen'});o.push({v:'roll',l:`Pasch versuchen (${p.jailTurns}/3)`,main:1});
 say(`${p.name} sitzt in U-Haft.`);
 const c=await choose(p,o,'jail');
 if(c==='pay'){pay(p,50,null);p.jail=false;say(`${p.name} zahlt 50 Mio Kaution.`);render();return 'free'}
 if(c==='card'){const d=p.free.pop();S.decks[d].push(FREE[d]);p.jail=false;say(`${p.name} nutzt die Kronzeugenregelung.`);render();return 'free'}
 const[a,b]=await rollDice();
 if(a===b){p.jail=false;say(`Pasch! ${p.name} ist frei.`);await moveBy(p,a+b);await land(p,a+b);return 'moved'}
 if(p.jailTurns>=3){p.jail=false;pay(p,50,null);say(`Dritter Versuch ohne Pasch: ${p.name} zahlt 50 Mio und zieht.`);await moveBy(p,a+b);await land(p,a+b);return 'moved'}
 say(`Kein Pasch – ${p.name} bleibt in U-Haft.`);return 'stay';
}
async function playTurn(){
 const p=S.players[S.cur];S.dbl=0;render();
 if(p.jail){const r=await jailTurn(p);if(r!=='free')return endTurn(p)}
 say(`${p.name} ist am Zug.`);
 while(!p.bankrupt&&!S.over){
  await choose(p,[{v:'roll',l:'Würfeln',main:1}],'roll');
  const[a,b]=await rollDice(),d=a===b;
  if(d&&++S.dbl===3){say(`Dreimal Pasch – Verdacht auf Kursmanipulation! ${p.name} muss in U-Haft.`);toJail(p);break}
  log(`${p.name} würfelt ${a} + ${b}${d?' (Pasch)':''}.`);
  await moveBy(p,a+b);await land(p,a+b);
  if(p.bankrupt||p.jail||!d)break;
  say(`Pasch! ${p.name} würfelt noch einmal.`);
 }
 await endTurn(p);
}
async function endTurn(p){
 await settle(p);if(p.bankrupt||S.over)return;
 await choose(p,[{v:'end',l:'Zug beenden',main:1}],'end');
}
function save(){lastSave=JSON.stringify(S);try{localStorage.setItem('weltkonzerne-save',lastSave)}catch(e){}}
let loopId=0;
async function gameLoop(){
 const my=++loopId;
 try{while(S&&!S.over&&my===loopId){
  save();await playTurn();if(my!==loopId||S.over)break;
  do S.cur=(S.cur+1)%S.players.length;while(S.players[S.cur].bankrupt);
 }}catch(e){if(e!=='abort')throw e;return}
 if(S&&S.over)try{localStorage.removeItem('weltkonzerne-save')}catch(e){}
}
function startGame(cfg,speed){
 S={players:cfg.map((c,k)=>({name:c.name,ai:c.ai,color:COLORS[k],money:1500,pos:0,jail:false,jailTurns:0,free:[],bankrupt:false,creditor:null})),
  props:{},cur:0,dbl:0,houses:32,hotels:12,decks:{chance:shuffle([...CHANCE.keys()]),chest:shuffle([...CHEST.keys()])},log:[],over:false,speed,dice:[3,4]};
 SP.forEach((s,i)=>{if(BUY(s))S.props[i]={owner:-1,houses:0,mort:false}});
 log('Neues Spiel. Jeder startet mit 1.500 Mio.');resume();
}
function resume(){gen++;pending=null;$('#actions').innerHTML='';tokEls.forEach(t=>t.remove());tokEls=[];closeModal();render();renderLog();gameLoop()}

/* ===== Startbildschirm & Regeln ===== */
function showSetup(){
 let saved=null;try{saved=localStorage.getItem('weltkonzerne-save')}catch(e){}
 let n=4;
 const draw=()=>{const box=openModal(`<div class="setup"><h3>Weltkonzerne – neues Spiel</h3>
  <p class="note">Würfeln, Firmen kaufen, Zonen komplettieren, Filialen bauen, Mitspieler in den Bankrott treiben. Mehrere Menschen spielen abwechselnd am selben Gerät.</p>
  <label class="field">Anzahl Spieler<select id="np">${[2,3,4,5,6].map(v=>`<option ${v===n?'selected':''}>${v}</option>`).join('')}</select></label>
  <div style="margin-top:12px">${Array.from({length:n},(_,k)=>`<div class="prow"><span class="dot" style="background:${COLORS[k]}"></span><input id="pn${k}" value="${esc(DEFN[k])}" maxlength="16" aria-label="Name Spieler ${k+1}"><select id="pt${k}" aria-label="Typ Spieler ${k+1}"><option value="h" ${k===0?'selected':''}>Mensch</option><option value="ai" ${k>0?'selected':''}>Computer</option></select></div>`).join('')}</div>
  <label class="field">Tempo der Computer<select id="spd"><option value="1">Normal</option><option value="0.45">Schnell</option><option value="0.15">Sehr schnell</option></select></label>
  <div class="row"><button class="btn main" id="go">Spiel starten</button>${saved?'<button class="btn" id="cont">Gespeichertes Spiel fortsetzen</button>':''}${S&&!S.over&&!S.demo?'<button class="btn" id="x">Abbrechen</button>':''}</div></div>`);
  box.querySelector('#np').onchange=e=>{n=+e.target.value;draw()};
  box.querySelector('#go').onclick=()=>{const cfg=Array.from({length:n},(_,k)=>({name:(box.querySelector('#pn'+k).value.trim()||`Spieler ${k+1}`).slice(0,16),ai:box.querySelector('#pt'+k).value==='ai'}));startGame(cfg,+box.querySelector('#spd').value)};
  box.querySelector('#cont')?.addEventListener('click',()=>{try{S=JSON.parse(saved);resume()}catch(e){draw()}});
  box.querySelector('#x')?.addEventListener('click',closeModal);
 };
 draw();
}
function showRules(){
 const box=openModal(`<h3>Spielregeln</h3>
 <p><b>Ziel:</b> Als Letzter nicht bankrott sein. Jeder startet mit 1.500 Mio.</p>
 <p><b>Zug:</b> Würfeln und im Uhrzeigersinn ziehen. Bei einem Pasch würfelst du noch einmal; beim dritten Pasch in Folge geht es in U-Haft. Über START gibt es 200 Mio.</p>
 <p><b>Firmen:</b> Landest du auf einer freien Firma, kannst du sie kaufen. Sonst wird sie versteigert. Wer auf einer fremden Firma landet, zahlt Miete. Besitzt du alle Firmen einer Zone (z. B. ganz Silicon Valley), verdoppelt sich die Grundmiete.</p>
 <p><b>Filialen &amp; Zentralen:</b> Mit kompletter Zone baust du gleichmäßig bis zu 4 Filialen je Firma, danach eine Konzernzentrale. Die Bank hat nur 32 Filialen und 12 Zentralen.</p>
 <p><b>Häfen &amp; Flughäfen:</b> Gebühr 25 / 50 / 100 / 200 je nach Anzahl. <b>Strom- und Datennetz:</b> 4× bzw. 10× die Augenzahl.</p>
 <p><b>Hypothek:</b> Bringt den halben Kaufpreis; solange keine Miete. Einlösen kostet 10 % Zinsen extra.</p>
 <p><b>U-Haft:</b> Raus mit 50 Mio Kaution, Freikarte oder Pasch. Nach dem dritten Fehlversuch zahlst du 50 Mio und ziehst.</p>
 <p><b>Schulden:</b> Kannst du nicht zahlen, verkaufe Filialen, nimm Hypotheken auf oder handle. Reicht alles nicht, bist du bankrott und dein Besitz geht an den Gläubiger.</p>
 <p class="note">Alle Firmen sind frei erfunden. Ähnlichkeiten mit echten Unternehmen sind Absicht der Branche, nicht der Marke.</p>
 <div class="row"><button class="btn main" id="x">Verstanden</button></div>`);box.querySelector('#x').onclick=closeModal;
}

/* ===== Start ===== */
buildBoard();
$('#bManage').onclick=()=>pending&&openManage(pending.p);
$('#bTrade').onclick=()=>pending&&openTrade(pending.p);
$('#bRules').onclick=()=>$('#ov').hidden&&showRules();
$('#bNew').onclick=()=>$('#ov').hidden&&showSetup();
window.claude?.hot?.snapshot?.(()=>({save:lastSave}));
const boot=d=>{
 if(d&&d.save){try{S=JSON.parse(d.save);resume();return}catch(e){}}
 // Vorschau-Zustand: Beispielspiel im Hintergrund, Startdialog darüber
 startDemo();showSetup();
};
function startDemo(){
 S={players:[{name:'Stefan',ai:false,color:COLORS[0],money:1240,pos:39,jail:false,jailTurns:0,free:[],bankrupt:false},{name:'KI Ada',ai:true,color:COLORS[1],money:980,pos:24,jail:false,jailTurns:0,free:[],bankrupt:false},{name:'KI Bruno',ai:true,color:COLORS[2],money:1510,pos:10,jail:true,jailTurns:1,free:[],bankrupt:false},{name:'KI Carla',ai:true,color:COLORS[3],money:760,pos:16,jail:false,jailTurns:0,free:[],bankrupt:false}],
  props:{},cur:0,dbl:0,houses:27,hotels:12,decks:{chance:[],chest:[]},log:['Beispielpartie – starte ein neues Spiel.'],over:false,demo:true,speed:1,dice:[5,6]};
 SP.forEach((s,i)=>{if(BUY(s))S.props[i]={owner:-1,houses:0,mort:false}});
 [[37,0,2],[39,0,3],[21,1,0],[23,1,0],[24,1,0],[5,2,0],[15,2,0],[16,3,0],[29,3,0],[12,2,0]].forEach(([i,o,h])=>{S.props[i].owner=o;S.props[i].houses=h});
 S.props[29].mort=true;render();renderLog();$('#msg').textContent='Starte ein neues Spiel.';
}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
